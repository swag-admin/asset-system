<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>設備資產管理</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏷️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
<link rel="preload" href="fonts/jf-openhuninn-2.1.woff2" as="font" type="font/woff2" crossorigin>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
/* jf open 粉圓（justfont，SIL Open Font License 1.1，授權見 fonts/LICENSE-jf-openhuninn.txt） */
@font-face{font-family:"jf open 粉圓";src:url("fonts/jf-openhuninn-2.1.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"jf open 粉圓";src:url("fonts/jf-openhuninn-2.1.woff2") format("woff2");font-weight:500;font-style:normal;font-display:swap}

:root{
  --bg:#F1F3F0; --surface:#FFFFFF; --surface-2:#E7EBE6; --ink:#1E2833; --ink-2:#5B6772; --line:#D3D9D2;
  --steel:#34506A; --steel-soft:#DCE5EC; --tag:#F2C230; --tag-ink:#2B2300;
  --red:#B8352B; --red-soft:#F6E1DE; --green:#2E7A57; --green-soft:#DDEFE5; --amber:#9A6412; --amber-soft:#F5EAD4;
  --focus:#2F6FB0; --shadow:0 12px 32px rgba(30,40,51,.16);
  --f-body:"jf open 粉圓","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-code:"Barlow Condensed","Arial Narrow","jf open 粉圓",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141A20; --surface:#1B232B; --surface-2:#242E38; --ink:#E5EAEE; --ink-2:#9AA7B3; --line:#313C47;
  --steel:#9BB6CF; --steel-soft:#26384A; --tag:#E6B923; --tag-ink:#231C00;
  --red:#E8695E; --red-soft:#3D2220; --green:#5DBB8C; --green-soft:#1E3529; --amber:#E0A94A; --amber-soft:#3A2E17;
  --focus:#6AA6E6; --shadow:0 12px 32px rgba(0,0,0,.5);
}}
:root[data-theme="dark"]{
  --bg:#141A20; --surface:#1B232B; --surface-2:#242E38; --ink:#E5EAEE; --ink-2:#9AA7B3; --line:#313C47;
  --steel:#9BB6CF; --steel-soft:#26384A; --tag:#E6B923; --tag-ink:#231C00;
  --red:#E8695E; --red-soft:#3D2220; --green:#5DBB8C; --green-soft:#1E3529; --amber:#E0A94A; --amber-soft:#3A2E17;
  --focus:#6AA6E6; --shadow:0 12px 32px rgba(0,0,0,.5);
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
img{max-width:100%}

.app{display:grid;grid-template-columns:232px 1fr;height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px;gap:18px;min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand-mark{width:34px;height:24px;background:var(--tag);border-radius:4px 4px 4px 4px;position:relative;box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.18)}
.brand-mark::before{content:"";position:absolute;left:6px;top:6px;width:5px;height:5px;border-radius:50%;background:var(--surface)}
.brand-mark::after{content:"";position:absolute;right:5px;top:6px;bottom:6px;width:14px;background:repeating-linear-gradient(90deg,var(--tag-ink) 0 1.5px,transparent 1.5px 3px);opacity:.75}
.brand b{font-size:16px;letter-spacing:.02em}
.brand small{display:block;color:var(--ink-2);font-size:12px;line-height:1.2}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-radius:8px;color:var(--ink-2);font-weight:500}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--steel-soft);color:var(--steel)}
.nav button:focus-visible{outline:2px solid var(--focus)}
.nav .badge{font:600 13px/1 var(--f-code);background:var(--red);color:#fff;border-radius:10px;padding:3px 7px}
.side-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:14px;display:flex;gap:10px;align-items:center}
.side-foot img{width:32px;height:32px;border-radius:50%}
.side-foot .who{min-width:0}
.side-foot .who div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500;font-size:14px}
.role{font-size:12px;color:var(--ink-2)}

.main{display:flex;flex-direction:column;min-height:0;min-width:0}
.head{display:flex;align-items:center;gap:12px;padding:18px 28px 12px;flex-wrap:wrap}
.head h1{font-size:22px;margin:0;font-weight:700;letter-spacing:.01em}
.head .sub{color:var(--ink-2);font-size:13px}
.head .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.content{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 28px 22px;overflow:auto}
.content.fixed{overflow:hidden}

.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--steel);border-color:var(--steel);color:var(--surface)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--red)}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:4px 10px;font-size:13px}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.search{flex:1 1 260px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:0 12px}
.search input{border:0;background:transparent;padding:8px 0;flex:1;min-width:0;outline:none}
.search:focus-within{outline:2px solid var(--focus);outline-offset:1px}
select.in,input.in,textarea.in{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%}
.toolbar select.in{width:auto}
textarea.in{resize:vertical;min-height:90px;line-height:1.6}

.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{all:unset;cursor:pointer;display:inline-flex;align-items:baseline;gap:6px;padding:4px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;color:var(--ink-2)}
.chip b{font:600 15px/1 var(--f-code);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip[aria-pressed="true"] b{color:var(--surface)}
.chip:focus-visible{outline:2px solid var(--focus)}

.tag{display:inline-block;font:600 15px/1 var(--f-code);letter-spacing:.04em;background:var(--surface-2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);padding:4px 7px 3px;border-radius:4px;white-space:nowrap}
.ep{position:relative}
.ep .ep-in{padding-right:32px}
.ep-x{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--ink-2);cursor:pointer;font-size:13px;padding:4px 6px;border-radius:4px}
.ep-x:hover{background:var(--surface-2);color:var(--ink)}
.ep-list{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:6;background:var(--surface);box-shadow:var(--shadow);margin-top:0!important;max-height:280px}
.ep-list button{font-size:14px;color:var(--ink)}
.ep-list button[aria-selected="true"]{background:var(--steel-soft)}
.st{display:inline-flex;align-items:center;gap:5px;font-size:13px;white-space:nowrap}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st.available{color:var(--green)} .st.in_use{color:var(--steel)} .st.repair{color:var(--amber)} .st.lost{color:var(--red)} .st.retired{color:var(--ink-2)}
.muted{color:var(--ink-2)}
.small{font-size:13px}
.num{font-family:var(--f-code);font-size:15px;letter-spacing:.02em}

/* virtual table */
.vt{flex:1;min-height:240px;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.vt-head,.vt-row{display:grid;align-items:center;gap:12px;padding:0 16px}
.vt-head{height:38px;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--ink-2);font-weight:500;background:var(--surface-2)}
.vt-scroll{flex:1;overflow:auto;position:relative;overscroll-behavior:contain}
.vt-spacer{position:relative}
.vt-rows{position:absolute;left:0;right:0;top:0}
.vt-row{border-bottom:1px solid var(--line);cursor:pointer}
.vt-row:hover{background:var(--surface-2)}
.vt-row>*{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vt-row .l2{display:block;font-size:12.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis}
.vt-empty{padding:48px 20px;text-align:center;color:var(--ink-2)}
.vt-foot{font-size:12.5px;color:var(--ink-2);padding:6px 16px;border-top:1px solid var(--line);display:flex;justify-content:space-between}
.g-assets{grid-template-columns:40px 136px minmax(150px,2fr) 100px 96px minmax(90px,1fr) minmax(80px,1fr) 104px}
.thumb{width:40px;height:40px;border-radius:6px;background:var(--surface-2) center/cover no-repeat;display:block;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.none{display:grid;place-items:center;color:var(--ink-2);font-size:11px}
.st.borrowed{color:#7A4FB5}
:root[data-theme="dark"] .st.borrowed{color:#B89AE6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .st.borrowed{color:#B89AE6}}
.due{font-size:12.5px}.due.over{color:var(--red);font-weight:700}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gallery figure{margin:0;position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--surface-2)}
.gallery figure img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.gallery figure .cover{position:absolute;left:6px;top:6px;background:var(--tag);color:var(--tag-ink);font-size:11px;font-weight:700;padding:1px 6px;border-radius:3px}
.gallery figure .ops{position:absolute;right:4px;bottom:4px;display:flex;gap:4px}
.gallery figure .ops button{border:0;background:rgba(0,0,0,.62);color:#fff;font-size:12px;padding:3px 7px;border-radius:5px;cursor:pointer}
.gallery .add{border:1.5px dashed var(--line);display:grid;place-items:center;color:var(--ink-2);cursor:pointer;font-size:13px;text-align:center;background:transparent}
.gallery .add:hover{border-color:var(--ink-2);color:var(--ink)}
.lightbox{position:fixed;inset:0;background:rgba(10,14,18,.9);z-index:70;display:none;align-items:center;justify-content:center;padding:24px}
.lightbox.on{display:flex}.lightbox img{max-width:100%;max-height:100%;border-radius:6px}
.card .cph{width:100%;aspect-ratio:4/3;border-radius:8px;object-fit:cover;display:block;margin-bottom:8px;background:var(--surface-2)}
.g-emps{grid-template-columns:100px minmax(100px,1.2fr) minmax(90px,1fr) 80px 110px 80px}
.g-sos{grid-template-columns:150px 90px minmax(100px,1.3fr) 60px 110px 100px}
.g-reps{grid-template-columns:96px 136px minmax(140px,1.6fr) minmax(100px,1fr) 90px 96px 100px}
.vals{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-top:4px}
.vals div{background:var(--surface-2);border-radius:8px;padding:8px 12px}
.vals dt{font-size:12px;color:var(--ink-2)} .vals dd{margin:0;font:600 18px/1.3 var(--f-code);letter-spacing:.02em}
.vals dd small{font:12px var(--f-body);color:var(--ink-2);font-weight:400}
.rs{font-size:12.5px;font-weight:500;padding:1px 8px;border-radius:4px;white-space:nowrap}
.rs.pending{background:var(--amber-soft);color:var(--amber)} .rs.done{background:var(--green-soft);color:var(--green)} .rs.bad{background:var(--surface-2);color:var(--ink-2)}
.dep-cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px 12px;margin-top:8px}
.dep-cats label{display:flex;align-items:center;gap:8px;font-size:13.5px}
.dep-cats input{width:72px}

/* drawer & modal */
.scrim{position:fixed;inset:0;background:rgba(15,22,30,.42);z-index:40;display:none}
.scrim.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);z-index:41;box-shadow:var(--shadow);transform:translateX(105%);transition:transform .22s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.on{transform:none}
.dr-head{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.dr-head h2{margin:0;font-size:18px;flex:1;min-width:0}
.dr-body{flex:1;overflow:auto;padding:18px 20px}
.dr-foot{display:flex;gap:8px;padding:12px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(620px,calc(100% - 24px));max-height:calc(100% - 40px);overflow:auto;background:var(--surface);border-radius:12px;box-shadow:var(--shadow);z-index:51;display:none;padding:22px}
.modal.on{display:block}
.modal h2{margin:0 0 6px;font-size:18px}
.scrim.m{z-index:50}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--ink-2);font-weight:500}
.form .full{grid-column:1/-1}
.req::after{content:" *";color:var(--red)}
.sec{margin:22px 0 8px;font-size:14px;font-weight:700}
.kv{display:grid;grid-template-columns:96px 1fr;gap:6px 12px;font-size:14px}
.kv dt{color:var(--ink-2)} .kv dd{margin:0}
.list{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.list .li{display:flex;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);font-size:14px}
.list .li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist{font-size:13px;color:var(--ink-2);display:flex;flex-direction:column;gap:4px}
.picks{border:1px solid var(--line);border-radius:8px;margin-top:6px;max-height:220px;overflow:auto}
.picks button{all:unset;display:flex;gap:10px;align-items:center;padding:8px 10px;width:100%;box-sizing:border-box;cursor:pointer}
.picks button:hover,.picks button:focus-visible{background:var(--surface-2)}
.picks img,.linked img{width:24px;height:24px;border-radius:50%}
.linked{display:flex;align-items:center;gap:8px;font-size:14px}

/* stamps */
.stamp{display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;border:2px solid currentColor;border-radius:5px;padding:1px 7px;letter-spacing:.08em;white-space:nowrap}
.stamp.signed{color:var(--green)} .stamp.pending{color:var(--red)} .stamp.void{color:var(--ink-2)} .stamp.paper{color:var(--green);border-style:dashed}
.seal{width:92px;height:92px;border-radius:50%;border:3px solid var(--red);color:var(--red);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-weight:700;line-height:1.25;transform:rotate(-12deg);font-size:15px;flex-shrink:0}
.seal span{display:block;font:600 12px var(--f-code);letter-spacing:.03em}

/* my page */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.card h3{margin:6px 0 2px;font-size:15px}
.pend{background:var(--surface);border:1px solid var(--red);border-left-width:5px;border-radius:10px;padding:16px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.pend .grow{flex:1;min-width:200px}
.notice{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;max-width:760px}
.notice h3{margin:0 0 6px;font-size:16px}
.prose{max-width:760px}
.prose p{margin:.4em 0 .9em}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:14px;max-width:820px}
.panel h3{margin:0 0 4px;font-size:16px}
.perm{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
.perm th,.perm td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
.perm th{color:var(--ink-2);font-weight:500;font-size:13px}
.meter{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;margin:8px 0 4px}
.meter i{display:block;height:100%;background:var(--steel)}
.meter.warn i{background:var(--red)}
.prog{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin:12px 0}
.prog i{display:block;height:100%;background:var(--green);width:0;transition:width .2s}

/* signature */
.sigwrap{border:1.5px dashed var(--ink-2);border-radius:8px;background:#fff;position:relative;touch-action:none}
.sigwrap canvas{display:block;width:100%;height:180px;cursor:crosshair}
.sigwrap .hint{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;color:#9aa;pointer-events:none;font-size:14px}
.sigimg{background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px;max-width:320px}
.sigimg svg{display:block;width:100%;height:auto}
.terms{white-space:pre-wrap;background:var(--surface-2);border-radius:8px;padding:12px 14px;font-size:13.5px;line-height:1.7}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:8px;font-size:14px;opacity:0;transition:.2s;z-index:60;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translateX(-50%)}
.toast.err{background:var(--red);color:#fff}
.loading{padding:60px 0;text-align:center;color:var(--ink-2)}
.hide{display:none!important}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

@media (max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .side{flex-direction:row;align-items:center;padding:10px 12px;gap:10px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  .brand small,.side-foot .who{display:none}
  .nav{flex-direction:row}
  .nav button{padding:7px 10px;white-space:nowrap}
  .side-foot{margin:0 0 0 auto;border:0;padding:0}
  .head{padding:14px 16px 10px}
  .content{padding:0 16px 16px}
  .vt-head{display:none}
  .g-assets,.g-emps,.g-sos,.g-reps{grid-template-columns:auto minmax(0,1fr) auto;gap:10px}
  .g-assets{grid-template-columns:40px auto minmax(0,1fr) auto}
  .vt-row>:last-child{text-align:right}
  .brand>div:last-child{display:none}
  .vt-row .mh{display:none}
  .form{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{body *{visibility:hidden}}

#root{height:100%}
.chips .lbl{font-size:12.5px;color:var(--ink-2);align-self:center;margin-right:4px;min-width:2.5em}
.chips.cat{margin-bottom:6px}
@media (max-width:860px){ .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none} .chips::-webkit-scrollbar{display:none} .chip{flex-shrink:0} }
.vt-row.ph{cursor:default}
.ph-bar{display:block;height:10px;border-radius:5px;background:var(--surface-2);width:70%}
.login{min-height:100%;display:grid;place-items:center;padding:24px}
.login-box{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px}
.login-box h1{font-size:20px;margin:14px 0 4px}
.login-box .btn{width:100%;padding:10px;margin-top:10px}
.or{display:flex;align-items:center;gap:10px;color:var(--ink-2);font-size:13px;margin:16px 0 6px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
"use strict";
/* ================= constants ================= */
const C = window.APP_CONFIG || {};
const STATUS = {available:"在庫可用", in_use:"使用中", borrowed:"借用中", repair:"維修中", lost:"遺失", retired:"已報廢"};
const HELD = new Set(["in_use","borrowed","repair"]);
const SO_TYPE = {issue:"資產設備領用簽收單", borrow:"測試機借用簽收單", return:"資產設備歸還確認單", inventory:"年度資產盤點確認單"};
const SO_SHORT = {issue:"領用", borrow:"借用", return:"歸還", inventory:"盤點"};
const REPAIR = {pending:"維修中", fixed:"已修復", parts:"更換零件", replaced:"原廠換新", scrapped:"無法修復，報廢", no_fault:"檢測無異常"};
const SALVAGE_MODE = {tax:"稅法算法：成本 ÷（耐用年數＋1）", percent:"成本的固定百分比", zero:"不留殘值"};
const MAX_PHOTOS = 6, PAGE = 100, BUCKET = "asset-photos";
const A_COLS = "id,tag,name,cat,brand,model,os,status,holder_id,holder_name,last_holder_name,due_date,assigned_date,location,updated_at,photos";
const GONE = new Set(["lost","retired"]);
const SO_COLS = "id,no,type,employee_id,employee_name,emp_no,dept,signer_email,items,created_at,voided,paper_signed_at,signed_at";

/* ================= state ================= */
const S = {
  sb:null, email:"", role:null, me:null, cfg:{company:"",app_url:"",categories:[],terms:""},
  emps:new Map(), counts:new Map(), view:null, list:null, pendingTotal:0,
  f:{q:"",status:"",cat:"",holder:"",sort:"tag",overdue:false}, ef:{q:"",sort:(()=>{try{return localStorage.getItem("empSort")||"no"}catch{return "no"}})(),dept:""}, sf:{q:"",st:"pending"}, rf:{q:"",st:"pending"}
};
const isAdmin = () => S.role === "admin";
const isStaff = () => S.role === "admin" || S.role === "viewer";

/* ================= utils ================= */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const fmtD = t => { if(!t) return ""; const d=new Date(t); return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())}`; };
const fmtDT = t => t ? `${fmtD(t)} ${pad(new Date(t).getHours())}:${pad(new Date(t).getMinutes())}` : "";
const todayStr = () => { const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const isOver = a => a.status==="borrowed" && a.due_date && a.due_date < todayStr();
const shortDue = d => d ? (d.slice(0,4)===todayStr().slice(0,4) ? d.slice(5).replace("-","/") : d.replace(/-/g,"/")) : "";
const words = q => q.trim().toLowerCase().split(/\s+/).map(w=>w.replace(/[%_\\*,()"]/g,"")).filter(Boolean);
const debounce = (f,ms) => { let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>f(...a),ms); }; };
const photoUrl = p => `${C.SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${p.split("/").map(encodeURIComponent).join("/")}`;
const coverT = a => a.photos && a.photos[0] ? photoUrl(a.photos[0].t || a.photos[0].p) : "";
const empName = id => (S.emps.get(id)||{}).name || "";
const money = n => n==null||n==="" ? "—" : "$"+Math.round(+n).toLocaleString();
const lifeFor = cat => { const m=S.cfg.dep_life||{}; return m[cat]!=null ? +m[cat] : (+S.cfg.dep_default_life||3); };
let toastT;
function toast(msg, kind){ const t=$("#toast"); t.textContent=msg; t.className="toast on"+(kind==="err"?" err":""); clearTimeout(toastT); toastT=setTimeout(()=>t.className="toast",kind==="err"?5500:2600); }
function dbErr(e){
  const c=e&&e.code, m=(e&&e.message)||"";
  if(c==="23505") return /tag/.test(m)?"資產編號已存在":/emp_no/.test(m)?"員工編號已存在":/email/.test(m)?"這個 Email 已被其他員工使用":/roles/.test(m)?"這個 Email 已在名單中":"資料重複";
  if(c==="42501"||/row-level security/i.test(m)) return "沒有權限執行這個動作";
  if(c==="23503") return "這筆資料仍被使用中（例如員工名下還有設備），無法刪除";
  if(c==="23514") return "資料不完整：使用中、借用中需要保管人，借用中需要歸還日";
  if(c==="P0001") return m;
  if(/JWT|PGRST30/.test(m+(c||""))) return "登入已過期，請重新整理頁面";
  if(/fetch|network/i.test(m)) return "無法連線，請檢查網路後再試";
  return m || "發生錯誤，請再試一次";
}
async function q(p){ const r=await p; if(r.error) throw r.error; return r.data; }
async function run(fn, ok){ try{ const r=await fn(); if(ok) toast(ok); return r; }catch(e){ console.error(e); toast(dbErr(e),"err"); throw e; } }
async function fetchAll(build){ const out=[]; for(let from=0;;from+=1000){ const rows=await q(build().range(from,from+999)); out.push(...rows); if(rows.length<1000) break; } return out; }

/* ================= list components ================= */
const mobile = matchMedia("(max-width:860px)");
const rowH = () => mobile.matches ? 64 : 52;
function listShell(host, grid, head){
  host.innerHTML = `<div class="vt">${head?`<div class="vt-head ${grid}">${head}</div>`:""}<div class="vt-scroll" tabindex="0"><div class="vt-spacer"><div class="vt-rows"></div></div></div><div class="vt-foot"></div></div>`;
  return {sc:host.querySelector(".vt-scroll"), sp:host.querySelector(".vt-spacer"), rows:host.querySelector(".vt-rows"), ft:host.querySelector(".vt-foot")};
}
// In-memory virtual list
class VList {
  constructor(host,o){ this.o=o; this.items=[]; Object.assign(this,listShell(host,o.grid,o.head)); this.raf=0;
    this.sc.addEventListener("scroll",()=>this.schedule(),{passive:true}); this.ro=new ResizeObserver(()=>this.schedule()); this.ro.observe(this.sc);
    this.sc.addEventListener("click",e=>{ const r=e.target.closest(".vt-row[data-id]"); if(r) o.onClick(r.dataset.id); }); }
  set(items,keep){ this.items=items; if(!keep) this.sc.scrollTop=0; this.draw(); this.ft.innerHTML=this.o.foot?this.o.foot(items.length):""; }
  schedule(){ if(!this.raf) this.raf=requestAnimationFrame(()=>{this.raf=0;this.draw();}); }
  draw(){ const n=this.items.length,h=rowH();
    if(!n){ this.sp.style.height="auto"; this.rows.style.position="static"; this.rows.style.transform=""; this.rows.innerHTML=`<div class="vt-empty">${this.o.empty()}</div>`; return; }
    this.rows.style.position="absolute"; this.sp.style.height=n*h+"px";
    const top=this.sc.scrollTop, vh=this.sc.clientHeight||600, a=Math.max(0,Math.floor(top/h)-6), b=Math.min(n,Math.ceil((top+vh)/h)+6);
    let html=""; for(let i=a;i<b;i++) html+=`<div class="vt-row ${this.o.grid}" style="height:${h}px" data-id="${esc(this.items[i].id)}">${this.o.row(this.items[i])}</div>`;
    this.rows.style.transform=`translateY(${a*h}px)`; this.rows.innerHTML=html; }
  destroy(){ this.ro.disconnect(); }
}
// Server-paged virtual list: only fetches the pages that are on screen
class PList extends VList {
  constructor(host,o){ super(host,o); this.total=0; this.pages=new Map(); this.loading=new Set(); this.ver=0; }
  reset(total,keep){ this.ver++; this.total=total; this.pages.clear(); this.loading.clear(); if(!keep) this.sc.scrollTop=0; this.draw(); this.ft.innerHTML=this.o.foot?this.o.foot(total):""; }
  at(i){ const p=this.pages.get(Math.floor(i/PAGE)); return p ? p[i%PAGE] : null; }
  async load(pg){ if(this.pages.has(pg)||this.loading.has(pg)) return; const v=this.ver; this.loading.add(pg);
    try{ const rows=await this.o.fetch(pg*PAGE, pg*PAGE+PAGE-1); if(v!==this.ver) return; this.pages.set(pg,rows); this.schedule(); }
    catch(e){ console.error(e); if(v===this.ver) toast(dbErr(e),"err"); }
    finally{ if(v===this.ver) this.loading.delete(pg); } }
  draw(){ const n=this.total,h=rowH();
    if(!n){ this.sp.style.height="auto"; this.rows.style.position="static"; this.rows.style.transform=""; this.rows.innerHTML=`<div class="vt-empty">${this.o.empty()}</div>`; return; }
    this.rows.style.position="absolute"; this.sp.style.height=n*h+"px";
    const top=this.sc.scrollTop, vh=this.sc.clientHeight||600, a=Math.max(0,Math.floor(top/h)-6), b=Math.min(n,Math.ceil((top+vh)/h)+6);
    for(let pg=Math.floor(a/PAGE); pg<=Math.floor((b-1)/PAGE); pg++) this.load(pg);
    let html=""; for(let i=a;i<b;i++){ const it=this.at(i);
      html += it ? `<div class="vt-row ${this.o.grid}" style="height:${h}px" data-id="${esc(it.id)}">${this.o.row(it)}</div>`
                 : `<div class="vt-row ph" style="height:${h}px;display:flex;align-items:center;padding:0 16px"><span class="ph-bar"></span></div>`; }
    this.rows.style.transform=`translateY(${a*h}px)`; this.rows.innerHTML=html; }
}

/* ================= shell ================= */
function shell(){
  $("#root").innerHTML = `<div class="app">
    <aside class="side">
      <div class="brand"><div class="brand-mark" aria-hidden="true"></div><div><b id="brandName"></b><small>行政部</small></div></div>
      <nav class="nav" id="nav" aria-label="主選單"></nav>
      <div class="side-foot"><div class="who"><div id="whoName"></div><span class="role" id="whoRole"></span></div><button class="btn sm ghost out" data-act="logout">登出</button></div>
    </aside>
    <main class="main"><div class="head"><div><h1 id="title"></h1><div class="sub" id="subtitle"></div></div><div class="actions" id="headActions"></div></div>
    <div class="content" id="content"></div></main></div>`;
  $("#brandName").textContent = S.cfg.company || "設備資產管理";
  $("#whoName").textContent = S.me ? S.me.name : S.email;
  $("#whoRole").textContent = {admin:"資產管理員",viewer:"唯讀",member:"員工"}[S.role];
}
function navViews(){
  const v=[];
  if(isStaff()) v.push(["assets","資產總覽"],["repairs","維修紀錄"],["emps","員工"],["sos","簽收單"]);
  if(S.me) v.push(["mine","我的資產"]);
  v.push(isAdmin()?["settings","設定與權限"]:["help","權限說明"]);
  return v;
}
function renderNav(){
  $("#nav").innerHTML = navViews().map(([k,l])=>{ const n = k==="sos"?S.pendingTotal : k==="mine"?S.myPending||0 : k==="repairs"?S.repairPending||0 : 0;
    return `<button data-view="${k}" ${S.view===k?'aria-current="page"':""}><span>${l}</span>${n?`<span class="badge">${n}</span>`:""}</button>`; }).join("");
}
function setHead(title, sub, actions){ $("#title").textContent=title; $("#subtitle").textContent=sub||""; $("#headActions").innerHTML=actions||""; }
function go(view){
  if(S.list){ S.list.destroy(); S.list=null; }
  S.view=view; closeDrawer(); renderNav();
  const c=$("#content"); c.className="content"; c.scrollTop=0; c.innerHTML="";
  ({assets:viewAssets, repairs:viewRepairs, emps:viewEmps, sos:viewSos, mine:viewMine, settings:viewSettings, help:viewHelp}[view])();
}
async function refreshCounts(){
  if(isStaff()){
    try{ const st=await q(S.sb.rpc("signoff_stats",{p_words:[]})); S.pendingTotal=st.pending; }catch{}
    try{ const rs=await q(S.sb.rpc("repair_stats")); S.repairPending=rs.pending; S.repairStats=rs; }catch{}
  }
  if(S.me){ const {count}=await S.sb.from("signoffs").select("id",{count:"exact",head:true}).eq("employee_id",S.me.id).eq("voided",false).is("signed_at",null).is("paper_signed_at",null);
    S.myPending=count||0; }
  renderNav();
}
async function loadEmps(){
  if(!isStaff()) return;
  const rows=await fetchAll(()=>S.sb.from("employees").select("id,emp_no,name,dept,email,slack_id,active").order("emp_no"));
  S.emps=new Map(rows.map(e=>[e.id,e]));
  const cs=await q(S.sb.rpc("employee_counts")); S.counts=new Map(cs.map(c=>[c.employee_id,c]));
}
// refresh when coming back to the tab
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible" && S.view && !$("#drawer").classList.contains("on") && !$("#modal").classList.contains("on")) softRefresh(); });
async function softRefresh(){
  await refreshCounts();
  if(S.view==="assets") updAssets(true); else if(S.view==="sos") updSos(true); else if(S.view==="repairs") loadRepairs(true); else if(S.view==="emps"){ await loadEmps(); updEmps(true); } else if(S.view==="mine") viewMine();
}

/* ================= ASSETS ================= */
function assetQuery(sel){
  const f=S.f; let x=S.sb.from("assets").select(sel);
  for(const w of words(f.q)) x=x.like("search",`%${w}%`);
  if(f.cat) x=x.eq("cat",f.cat);
  if(f.holder) x=x.eq("holder_id",f.holder);
  if(f.overdue) x=x.eq("status","borrowed").lt("due_date",todayStr());
  else if(f.status) x=x.eq("status",f.status);
  const [col,asc]={tag:["tag",true],upd:["updated_at",false],name:["name",true]}[f.sort];
  return x.order(col,{ascending:asc}).order("id");
}
function viewAssets(){
  setHead("資產總覽","", isAdmin()?`<button class="btn" data-act="exportValues">價值報表 CSV</button><button class="btn" data-act="exportAssets">匯出 CSV</button><button class="btn" data-act="importAssets">匯入 CSV</button><button class="btn primary" data-act="newAsset">新增資產</button>`:`<button class="btn" data-act="exportValues">價值報表 CSV</button><button class="btn" data-act="exportAssets">匯出 CSV</button>`);
  const c=$("#content"); c.classList.add("fixed");
  c.innerHTML = `<div class="toolbar">
    <label class="search"><span aria-hidden="true" class="muted">⌕</span><input id="aq" placeholder="搜尋編號、名稱、序號、保管人、位置…" value="${esc(S.f.q)}" aria-label="搜尋資產"></label>
    <select class="in" id="asort" aria-label="排序"><option value="tag">依編號</option><option value="upd">最近更新</option><option value="name">依名稱</option></select>
  </div><div class="chips cat" id="catchips" role="group" aria-label="依類別篩選"></div><div class="chips" id="achips" role="group" aria-label="依狀態篩選"></div><div id="alist" style="flex:1;min-height:0;display:flex;flex-direction:column"></div>`;
  $("#asort").value=S.f.sort;
  S.list = new PList($("#alist"), {grid:"g-assets", onClick:openAsset,
    head:`<span></span><span>資產編號</span><span>名稱／型號</span><span class="mh">類別</span><span>狀態</span><span class="mh">保管人</span><span class="mh">位置</span><span class="mh">更新／歸還</span>`,
    row:a=>`${coverT(a)?`<span class="thumb"><img src="${esc(coverT(a))}" alt="" loading="lazy" decoding="async"></span>`:`<span class="thumb none" aria-hidden="true">—</span>`}<span><span class="tag">${esc(a.tag)}</span></span><span>${esc(a.name)}<span class="l2">${esc([a.brand,a.model,a.os].filter(Boolean).join(" "))||"&nbsp;"}</span></span><span class="mh muted small">${esc(a.cat)}</span><span><span class="st ${esc(a.status)}">${STATUS[a.status]||""}</span>${mobile.matches&&a.holder_id?`<span class="l2 ${isOver(a)?"due over":""}">${esc(a.holder_name)}${isOver(a)?"・逾期":""}</span>`:mobile.matches&&GONE.has(a.status)&&a.last_holder_name?`<span class="l2">原保管人 ${esc(a.last_holder_name)}</span>`:""}</span><span class="mh">${a.holder_name?`${esc(a.holder_name)}${a.assigned_date?`<span class="l2">${esc(a.assigned_date.replace(/-/g,"/"))} 領用</span>`:""}`:GONE.has(a.status)&&a.last_holder_name?`<span class="muted">${esc(a.last_holder_name)}<span class="l2">原保管人</span></span>`:'<span class="muted">—</span>'}</span><span class="mh muted small">${esc(a.location)}</span>${a.status==="borrowed"&&a.due_date?`<span class="mh due ${isOver(a)?"over":""}">${isOver(a)?"逾期 ":"應還 "}${esc(shortDue(a.due_date))}</span>`:`<span class="mh muted num">${fmtD(a.updated_at)}</span>`}`,
    empty:()=> S.stats && S.stats.total ? "找不到符合條件的資產，試試其他關鍵字或清除篩選。" : (isAdmin()?`尚無資產資料。<br><br><button class="btn primary" data-act="newAsset">新增第一筆資產</button> <button class="btn" data-act="importAssets">從 CSV 匯入</button>`:"尚無資產資料。"),
    foot:n=>`<span>顯示 ${n.toLocaleString()} ／ 共 ${(S.stats?.total||0).toLocaleString()} 筆</span><span>${S.f.holder?`已篩選保管人：${esc(empName(S.f.holder))} <button class="btn sm ghost" data-act="clearHolder">清除</button>`:""}</span>`,
    fetch:(from,to)=>q(assetQuery(A_COLS).range(from,to))
  });
  $("#aq").addEventListener("input", debounce(e=>{ S.f.q=e.target.value; updAssets(); },250));
  $("#asort").addEventListener("change", e=>{ S.f.sort=e.target.value; updAssets(); });
  updAssets();
}
let statVer=0;
async function updAssets(keep){
  if(S.view!=="assets"||!S.list) return;
  const v=++statVer, f=S.f;
  let st, cats=null;
  try{
    const [a,c]=await Promise.all([
      q(S.sb.rpc("asset_stats",{p_words:words(f.q),p_cat:f.cat,p_holder:f.holder||null,p_noholder:false})),
      S.sb.rpc("asset_cat_counts",{p_words:words(f.q),p_holder:f.holder||null})]);
    st=a;
    if(c.error){ if(!S.catWarned){ S.catWarned=true; console.warn(c.error); if(isAdmin()) toast("類別數量需要先在 Supabase 執行更新 SQL（update-category-filter.sql）","err"); } }
    else cats=c.data;
  }catch(e){ toast(dbErr(e),"err"); return; }
  if(v!==statVer||!S.list) return;
  S.stats=st; renderCatChips(cats);
  $("#achips").innerHTML = `<span class="lbl">狀態</span>`+[["","全部",st.all],...Object.entries(STATUS).map(([k,l])=>[k,l,st[k]])]
    .map(([k,l,n])=>`<button class="chip" data-status="${k}" aria-pressed="${!f.overdue&&f.status===k}">${l}<b>${n.toLocaleString()}</b></button>`).join("")
    + (st.overdue?`<button class="chip" data-overdue="1" aria-pressed="${f.overdue}" style="${f.overdue?"":"color:var(--red);border-color:var(--red)"}">逾期未還<b style="${f.overdue?"":"color:var(--red)"}">${st.overdue}</b></button>`:"");
  $("#subtitle").textContent=`${st.total.toLocaleString()} 筆資產，${st.holders} 位員工持有中`;
  S.sb.rpc("asset_value_summary").then(({data})=>{ if(data&&S.view==="assets"&&v===statVer) $("#subtitle").textContent=`${st.total.toLocaleString()} 筆資產，${st.holders} 位員工持有中，帳面價值 ${money(data.book)}（原始成本 ${money(data.cost)}）`; });
  S.list.reset(f.overdue?st.overdue:f.status?st[f.status]:st.all, keep);
}

function renderCatChips(cats){
  const box=$("#catchips"); if(!box) return; const f=S.f;
  const counts=new Map((cats||[]).map(c=>[c.cat,+c.n]));
  // settings order first, then any other categories found in the data
  const names=[...S.cfg.categories.filter(c=>counts.get(c)||c===f.cat), ...[...counts.keys()].filter(c=>!S.cfg.categories.includes(c)).sort((a,b)=>a.localeCompare(b,"zh-Hant"))];
  if(!cats) for(const c of S.cfg.categories) if(!names.includes(c)) names.push(c);
  const total=[...counts.values()].reduce((a,b)=>a+b,0);
  box.innerHTML=`<span class="lbl">類別</span><button class="chip" data-cat="" aria-pressed="${!f.cat}">全部${cats?`<b>${total.toLocaleString()}</b>`:""}</button>`+
    names.map(c=>`<button class="chip" data-cat="${esc(c)}" aria-pressed="${f.cat===c}">${esc(c)}${cats?`<b>${(counts.get(c)||0).toLocaleString()}</b>`:""}</button>`).join("");
}

/* ---------- asset drawer ---------- */
let drawerAsset=null;
function openDrawer(title, body, foot){ $("#drTitle").innerHTML=title; $("#drBody").innerHTML=body; $("#drFoot").innerHTML=foot||""; $("#drawer").classList.add("on"); $("#scrim").classList.add("on"); $("#drBody").scrollTop=0; }
function closeDrawer(){ $("#drawer").classList.remove("on"); $("#scrim").classList.remove("on"); drawerAsset=null; }
/* ---------- 可輸入搜尋的員工選擇欄 ---------- */
const empLabel = e => e ? `${e.emp_no} ${e.name}${e.dept?"・"+e.dept:""}` : "";
function empPicker(name, sel, placeholder){
  return `<div class="ep" data-ep="${name}"><input type="hidden" name="${name}" value="${esc(sel||"")}">
    <input class="in ep-in" type="text" autocomplete="off" spellcheck="false" value="${esc(empLabel(S.emps.get(sel)))}" placeholder="${esc(placeholder||"輸入姓名、員工編號或部門搜尋")}" role="combobox" aria-expanded="false" aria-autocomplete="list">
    <button type="button" class="ep-x ${sel?"":"hide"}" aria-label="清除">✕</button><div class="picks ep-list hide" role="listbox"></div></div>`;
}
function setEmpPick(box, id){
  if(!box) return;
  const h=box.querySelector('input[type=hidden]'), changed=h.value!==(id||"");
  h.value=id||""; box.querySelector(".ep-in").value=empLabel(S.emps.get(id)); box.querySelector(".ep-x").classList.toggle("hide",!id);
  if(changed) h.dispatchEvent(new Event("change",{bubbles:true}));
}
function bindEmpPickers(root){
  root.querySelectorAll(".ep").forEach(box=>{
    const inp=box.querySelector(".ep-in"), list=box.querySelector(".ep-list"), h=box.querySelector("input[type=hidden]");
    let hits=[], idx=-1;
    const isOpen=()=>!list.classList.contains("hide");
    const close=()=>{ list.classList.add("hide"); inp.setAttribute("aria-expanded","false"); };
    const draw=()=>{
      list.innerHTML = hits.length ? hits.map((e,i)=>`<button type="button" role="option" data-i="${i}" aria-selected="${i===idx}"><span class="num">${esc(e.emp_no)}</span><span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(e.name)}<span class="muted small">${e.dept?"　"+esc(e.dept):""}</span></span></button>`).join("")
                                   : `<div class="small muted" style="padding:8px 10px">找不到符合的員工</div>`;
      list.classList.remove("hide"); inp.setAttribute("aria-expanded","true");
      const cur=list.querySelector('[aria-selected="true"]'); if(cur) cur.scrollIntoView({block:"nearest"});
    };
    const search=()=>{
      const cur=S.emps.get(h.value), ws=(cur&&inp.value===empLabel(cur)) ? [] : inp.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
      hits=[...S.emps.values()].filter(e=>e.active||e.id===h.value)
        .filter(e=>{ const t=[e.emp_no,e.name,e.dept,e.email].join(" ").toLowerCase(); return ws.every(w=>t.includes(w)); })
        .sort(byEmpNo).slice(0,80);
      idx=hits.length?0:-1; draw();
    };
    inp.addEventListener("focus",()=>{ inp.select(); search(); });
    inp.addEventListener("input",search);
    inp.addEventListener("keydown",e=>{
      if(e.key==="ArrowDown"||e.key==="ArrowUp"){ e.preventDefault(); if(!isOpen()) search(); else if(hits.length){ idx=(idx+(e.key==="ArrowDown"?1:-1)+hits.length)%hits.length; draw(); } }
      else if(e.key==="Enter"){ e.preventDefault(); if(isOpen()&&hits[idx]){ setEmpPick(box,hits[idx].id); close(); } }
      else if(e.key==="Escape"&&isOpen()){ e.stopPropagation(); close(); inp.value=empLabel(S.emps.get(h.value)); }
    });
    list.addEventListener("mousedown",e=>{ e.preventDefault(); const b=e.target.closest("[data-i]"); if(b){ setEmpPick(box,hits[+b.dataset.i].id); close(); inp.blur(); } });
    inp.addEventListener("blur",()=>{
      const typed=inp.value.trim(), cur=S.emps.get(h.value);
      if(!typed) setEmpPick(box,"");
      else if(!(cur&&inp.value===empLabel(cur)) && hits.length===1) setEmpPick(box,hits[0].id);   // 只剩一個符合的人，直接選他
      else inp.value=empLabel(cur);
      close();
    });
    box.querySelector(".ep-x").addEventListener("click",()=>{ setEmpPick(box,""); inp.focus(); });
  });
}
function empOptions(sel){
  const arr=Array.from(S.emps.values()).filter(e=>e.active||e.id===sel);
  return `<option value="">（無）</option>`+arr.map(e=>`<option value="${esc(e.id)}" ${e.id===sel?"selected":""}>${esc(e.emp_no)} ${esc(e.name)}${e.dept?"・"+esc(e.dept):""}</option>`).join("");
}
async function nextTag(){
  try{ const r=await q(S.sb.from("assets").select("tag").like("tag","IT-%").order("tag",{ascending:false}).limit(1));
    const m=r[0]&&/^IT-(\d+)$/.exec(r[0].tag); const n=m?+m[1]+1:1; return "IT-"+String(n).padStart(Math.max(4,m?m[1].length:4),"0"); }catch{ return ""; }
}

async function saveAsset(id){
  const f=$("#af"); if(!f.reportValidity()) return;
  const fd=Object.fromEntries(new FormData(f).entries()); for(const k in fd) fd[k]=String(fd[k]).trim();
  if((fd.status==="in_use"||fd.status==="borrowed") && !fd.holder_id){ toast(`狀態為「${STATUS[fd.status]}」時請選擇${fd.status==="borrowed"?"借用人":"保管人"}`,"err"); return; }
  if(fd.status==="borrowed" && !fd.due_date){ toast("請填寫預計歸還日","err"); f.due_date.focus(); return; }
  const data={...fd}; for(const k of ["holder_id","last_holder_id","due_date","assigned_date","purchase_date","warranty_end"]) data[k]=data[k]||null;
  if(!GONE.has(data.status)) delete data.last_holder_id;   // 只有遺失／報廢時由畫面指定，其餘由系統自動記錄
  data.cost = fd.cost===""?null:Number(fd.cost);
  data.life_years = fd.life_years===""?null:Number(fd.life_years);
  data.salvage = fd.salvage===""?null:Number(fd.salvage);
  if(!HELD.has(data.status)) data.holder_id=null; if(data.status!=="borrowed") data.due_date=null; if(!data.holder_id) data.assigned_date=null;
  const btn=$('[data-act="saveAsset"]'); btn.disabled=true;
  try{
    const row = await run(()=> id ? q(S.sb.from("assets").update(data).eq("id",id).select("id").single()) : q(S.sb.from("assets").insert(data).select("id").single()), id?"已儲存變更":"已新增資產，可以上傳照片了");
    loadEmps().catch(()=>{}); updAssets(true);
    if(id) closeDrawer(); else openAsset(row.id);
  }catch{ btn.disabled=false; }
}
function delAsset(id){
  const a=drawerAsset; if(!a) return;
  confirmBox(`刪除資產 ${a.tag}？`,`「${a.name}」的資料、照片與異動紀錄將永久刪除，無法復原。若設備只是不再使用，建議改為「已報廢」以保留紀錄。`,"刪除資產",async()=>{
    await run(()=>q(S.sb.from("assets").delete().eq("id",id)),"已刪除資產");
    const paths=(a.photos||[]).flatMap(p=>[p.p,p.t]).filter(Boolean); if(paths.length) S.sb.storage.from(BUCKET).remove(paths).catch(()=>{});
    closeDrawer(); updAssets(true); loadEmps().catch(()=>{});
  },true,a.tag);
}

function renderPhotos(){
  const box=$("#photoBox"), a=drawerAsset; if(!box||!a) return;
  const ph=a.photos||[], can=isAdmin();
  box.innerHTML=`<div class="gallery">${ph.map((p,i)=>`<figure><img src="${esc(photoUrl(p.t||p.p))}" data-full="${esc(photoUrl(p.p))}" alt="${esc(a.name)} 照片 ${i+1}" loading="lazy">${i===0?'<span class="cover">封面</span>':""}${can?`<div class="ops">${i?`<button type="button" data-act="coverPhoto" data-i="${i}">設為封面</button>`:""}<button type="button" data-act="delPhoto" data-i="${i}">刪除</button></div>`:""}</figure>`).join("")}
  ${can&&ph.length<MAX_PHOTOS?`<label class="add" style="aspect-ratio:1;border-radius:8px">＋ 上傳照片<br><span class="small">可一次選多張</span><input type="file" accept="image/*" multiple hidden id="phIn"></label>`:""}</div>
  ${!ph.length&&!can?'<p class="small muted">尚無照片。</p>':""}<div class="small muted" style="margin-top:6px" id="phMsg">${can?`最多 ${MAX_PHOTOS} 張，上傳時會自動壓縮。`:""}</div>`;
  const inp=$("#phIn"); if(inp) inp.onchange=()=>uploadPhotos([...inp.files]);
}
async function shrink(file,max,qual){
  let bmp; try{ bmp=await createImageBitmap(file,{imageOrientation:"from-image"}); }catch{ bmp=await new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=URL.createObjectURL(file); }); }
  const k=Math.min(1,max/Math.max(bmp.width,bmp.height)), cv=document.createElement("canvas"); cv.width=Math.round(bmp.width*k); cv.height=Math.round(bmp.height*k);
  const cx=cv.getContext("2d"); cx.fillStyle="#fff"; cx.fillRect(0,0,cv.width,cv.height); cx.drawImage(bmp,0,0,cv.width,cv.height);
  return await new Promise(r=>cv.toBlob(r,"image/jpeg",qual));
}
async function uploadPhotos(files){
  const a=drawerAsset; if(!a) return;
  files=files.filter(f=>/^image\//.test(f.type)||/\.(heic|heif)$/i.test(f.name)).slice(0,MAX_PHOTOS-(a.photos||[]).length);
  if(!files.length) return;
  const msg=$("#phMsg"), added=[], st=S.sb.storage.from(BUCKET);
  for(let i=0;i<files.length;i++){
    if(msg) msg.textContent=`上傳中 ${i+1} / ${files.length}…`;
    try{
      const [full,th]=await Promise.all([shrink(files[i],1600,.82),shrink(files[i],240,.72)]);
      const key=`${a.id}/${Date.now().toString(36)}${Math.random().toString(36).slice(2,8)}`;
      const r1=await st.upload(key+".jpg",full,{contentType:"image/jpeg",cacheControl:"31536000"}); if(r1.error) throw r1.error;
      const r2=await st.upload(key+"_t.jpg",th,{contentType:"image/jpeg",cacheControl:"31536000"}); if(r2.error) throw r2.error;
      added.push({p:key+".jpg",t:key+"_t.jpg"});
    }catch(e){ console.error(e); toast(e&&e.message&&/row-level|Unauthorized|403/i.test(e.message)?"沒有上傳照片的權限":"有照片無法上傳，請改用 JPG 或 PNG 再試","err"); }
  }
  if(!added.length){ renderPhotos(); return; }
  const photos=[...(a.photos||[]),...added].slice(0,MAX_PHOTOS);
  await run(()=>q(S.sb.from("assets").update({photos}).eq("id",a.id)),`已上傳 ${added.length} 張照片`);
  a.photos=photos; renderPhotos(); updAssets(true);
}
async function coverPhoto(i){
  const a=drawerAsset; const ph=[...a.photos]; const [p]=ph.splice(i,1); ph.unshift(p);
  await run(()=>q(S.sb.from("assets").update({photos:ph}).eq("id",a.id)),"已設為封面"); a.photos=ph; renderPhotos(); updAssets(true);
}
async function delPhoto(i){
  const a=drawerAsset; const ph=[...a.photos]; const [p]=ph.splice(i,1);
  await run(()=>q(S.sb.from("assets").update({photos:ph}).eq("id",a.id)),"已刪除照片"); a.photos=ph; renderPhotos(); updAssets(true);
  S.sb.storage.from(BUCKET).remove([p.p,p.t].filter(Boolean)).catch(()=>{});
}

const repairBadge = r => `<span class="rs ${r.result==="pending"?"pending":r.result==="scrapped"?"bad":"done"}">${REPAIR[r.result]||""}</span>`;
const NEED_SQL = "需要先在 Supabase 執行更新 SQL（update-2026-10-repairs-depreciation.sql）";
function assetExtraHTML(a,x){
  if(x.missing) return `<div class="sec">價值、維修與使用紀錄</div><p class="small muted">${NEED_SQL}才會顯示。</p>`;
  const v=x.val; let h=`<div class="sec">價值與折舊</div>`;
  if(!v||v.cost==null) h+=`<p class="small muted">填入購入金額與購入日期後，系統會自動計算帳面價值。</p>`;
  else if(v.months_used==null) h+=`<p class="small muted">填入購入日期後，系統會自動計算帳面價值。</p>`;
  else h+=`<dl class="vals"><div><dt>目前帳面價值</dt><dd>${money(v.book_value)}</dd></div><div><dt>已折舊</dt><dd>${money(v.accumulated_dep)}<small>　${v.months_used} 個月</small></dd></div><div><dt>每月折舊</dt><dd>${money(v.monthly_dep)}</dd></div><div><dt>預估殘值</dt><dd>${money(v.salvage_value)}</dd></div></dl>
    <p class="small muted" style="margin:6px 0 0">耐用 ${+v.life_years} 年，${+v.book_value<=+v.salvage_value?"已折舊完畢":`預計 ${fmtD(v.fully_depreciated_on)} 折舊完畢`}${+v.repair_total>0?`；累計維修費用 ${money(v.repair_total)}`:""}。</p>`;
  const open=x.reps.find(r=>r.result==="pending");
  h+=`<div class="sec row" style="justify-content:space-between"><span>維修紀錄（${x.reps.length}）</span>${isAdmin()&&!open&&a.status!=="retired"?`<button class="btn sm" data-act="newRepair" data-id="${esc(a.id)}">新增報修</button>`:""}</div>`;
  h+= x.reps.length?`<div class="list">${x.reps.map(r=>`<div class="li" style="cursor:pointer" data-act="openRepair" data-id="${esc(r.id)}"><span class="num muted">${fmtD(r.reported_at)}</span><span class="grow">${esc(r.issue)}${r.vendor?`<span class="muted small">　${esc(r.vendor)}</span>`:""}</span>${r.cost!=null?`<span class="num">${money(r.cost)}</span>`:""}${repairBadge(r)}</div>`).join("")}</div>`:`<p class="small muted">沒有維修紀錄。</p>`;
  h+=`<div class="sec">使用紀錄（${x.asg.length}）</div>`;
  h+= x.asg.length?`<div class="list">${x.asg.map(u=>`<div class="li"><span class="grow">${esc(u.employee_name||"（已刪除的員工）")}<span class="muted small">　${u.kind==="borrow"?"借用":"領用"}${u.signoff_no?"・"+esc(u.signoff_no):""}</span></span><span class="num muted">${fmtD(u.start_date)} – ${u.end_date?fmtD(u.end_date):"使用中"}</span></div>`).join("")}</div>`:`<p class="small muted">沒有使用紀錄。</p>`;
  return h;
}

  const A=isAdmin(), finished=r&&r.result!=="pending";
  modal(`<h2>${r?"維修紀錄":"新增報修"}</h2><p class="small muted" style="margin:0 0 12px"><span class="tag">${esc(a.tag)}</span> ${esc(a.name)}${r?"":"。送出後設備狀態會改為「維修中」，完成時自動恢復。"}</p>
  <form class="form" id="rpf" autocomplete="off"><fieldset style="display:contents" ${A?"":"disabled"}>

   <label>維修費用（元）<input class="in" type="number" min="0" name="cost" value="${esc(v.cost)}"></label>

   <label>完成日<input class="in" type="date" name="done_at" value="${esc(v.done_at)}"></label>

  </fieldset></form>
  <p class="small" id="rHint" style="margin:10px 0 0;color:var(--amber)"></p>
  <div class="row" style="margin-top:16px;justify-content:flex-end">${A&&r?`<button class="btn danger" id="rDel" style="margin-right:auto">刪除</button>`:""}<button class="btn" data-close>${A?"取消":"關閉"}</button>${A?`<button class="btn primary" id="rGo">${r?"儲存":"送出報修"}</button>`:""}</div>`);
  const f=$("#rpf"); bindEmpPickers(f);
  f.addEventListener("change",e=>{ if(e.target.name!=="result") return;
    if(f.result.value!=="pending"&&!f.done_at.value) f.done_at.value=todayStr();
    $("#rHint").textContent = f.result.value==="scrapped"&&!finished ? "儲存後，設備狀態會改為「已報廢」。" : f.result.value!=="pending"&&!finished ? "儲存後，設備會恢復成送修前的狀態與保管人。" : ""; });
  if($("#rGo")) $("#rGo").onclick=async()=>{
    if(!f.reportValidity()) return;
    const fd=Object.fromEntries(new FormData(f).entries());
    const data={reported_at:fd.reported_at, reporter_id:fd.reporter_id||null, issue:String(fd.issue).trim(), vendor:String(fd.vendor||"").trim(), sent_at:fd.sent_at||null,
      under_warranty:f.under_warranty.checked, cost:fd.cost===""?null:Number(fd.cost), result:fd.result, done_at:fd.done_at||null, note:String(fd.note||"").trim()};
    if(data.result!=="pending"&&!data.done_at) data.done_at=todayStr();
    $("#rGo").disabled=true;
    try{ await run(()=> r ? q(S.sb.from("repairs").update(data).eq("id",r.id)) : q(S.sb.from("repairs").insert({...data,asset_id:a.id})),
                   r ? "已儲存維修紀錄" : "已建立報修，設備已改為維修中");
         closeModal(); afterRepairChange(a.id); }
    catch{ $("#rGo").disabled=false; }
  };
  if($("#rDel")) $("#rDel").onclick=()=>confirmBox("刪除這筆維修紀錄？", r.result==="pending"?"設備會恢復成送修前的狀態。刪除後無法復原。":"刪除後無法復原。","刪除",
    async()=>{ await run(()=>q(S.sb.from("repairs").delete().eq("id",r.id)),"已刪除維修紀錄"); afterRepairChange(a.id); },true);
}
function afterRepairChange(assetId){

  if(S.view==="repairs") loadRepairs(true); else if(S.view==="assets") updAssets(true);

function pickRepairAsset(){

    <div class="row" style="margin-top:16px;justify-content:flex-end"><button class="btn" data-close>取消</button></div>`);
  const inp=$("#rpq"); setTimeout(()=>inp.focus(),30);
  inp.addEventListener("input",debounce(async()=>{

  });

async function loadRepairs(keep){
  try{ S.reps=await fetchAll(()=>S.sb.from("repairs").select("*,assets(tag,name)").order("reported_at",{ascending:false}).order("created_at",{ascending:false})); S.repsMissing=false; }
  catch(e){ console.warn(e); S.reps=[]; S.repsMissing=true; }
  if(!keep && S.rf.st==="pending" && !S.rf.q && !S.reps.some(r=>r.result==="pending")) S.rf.st="";
  try{ S.repairStats=await q(S.sb.rpc("repair_stats")); S.repairPending=S.repairStats.pending; renderNav(); }catch{}
  updRepairs(keep);
}
function updRepairs(keep){
  if(S.view!=="repairs"||!S.list) return;
  const all=S.reps||[], qq=S.rf.q;
  const m=all.filter(r=>!qq||[(r.assets||{}).tag,(r.assets||{}).name,r.issue,r.vendor,r.reporter_name,r.note].join(" ").toLowerCase().includes(qq));
  const pend=m.filter(r=>r.result==="pending").length, cnt={pending:pend,done:m.length-pend,"":m.length};
  $("#rchips").innerHTML=[["pending","維修中"],["done","已完成"],["","全部"]].map(([k,l])=>`<button class="chip" data-rst="${k}" aria-pressed="${S.rf.st===k}">${l}<b>${cnt[k].toLocaleString()}</b></button>`).join("");
  $("#subtitle").textContent=`${all.filter(r=>r.result==="pending").length} 件維修中`;
  S.list.set(m.filter(r=>!S.rf.st||(S.rf.st==="pending")===(r.result==="pending")),keep);
}

  $("#esort").value=S.ef.sort;
  $("#esort").addEventListener("change",e=>{ S.ef.sort=e.target.value; try{localStorage.setItem("empSort",S.ef.sort)}catch{} updEmps(); });

// 員工編號排序：TW 開頭的排最前面，其他前綴依字母順序，同前綴依數字大小
const empPrefix = e => { const m=/^[A-Za-z]+/.exec(String(e.emp_no||"")); return m?m[0].toUpperCase():""; };
const byEmpNo = (a,b) => { const pa=empPrefix(a), pb=empPrefix(b);
  return (pa!=="TW")-(pb!=="TW") || pa.localeCompare(pb) || String(a.emp_no).localeCompare(String(b.emp_no),undefined,{numeric:true}); };
const EMP_SORT = {
  no: byEmpNo,
  dept: (a,b) => (!a.dept)-(!b.dept) || String(a.dept).localeCompare(String(b.dept),"en") || byEmpNo(a,b),
  name: (a,b) => String(a.name).localeCompare(String(b.name),"zh-Hant") || byEmpNo(a,b)
};
function deptOptions(){
  const n=new Map(); for(const e of S.emps.values()){ const d=e.dept||""; n.set(d,(n.get(d)||0)+1); }
  const ds=[...n.keys()].filter(Boolean).sort((a,b)=>a.localeCompare(b,"en"));
  return `<option value="">全部部門</option>`+ds.map(d=>`<option value="${esc(d)}" ${S.ef.dept===d?"selected":""}>${esc(d)}（${n.get(d)}）</option>`).join("")
    +(n.get("")?`<option value="__none__" ${S.ef.dept==="__none__"?"selected":""}>未填部門（${n.get("")}）</option>`:"");
}
function updEmps(keep){
  if(S.view!=="emps"||!S.list) return;
  const qq=S.ef.q, out=[];
  for(const e of S.emps.values()){ if(qq && ![e.name,e.emp_no,e.dept,e.email].join(" ").toLowerCase().includes(qq)) continue;
    if(S.ef.dept && (S.ef.dept==="__none__"?(e.dept||""):e.dept)!==(S.ef.dept==="__none__"?"":S.ef.dept)) continue; out.push(e); }
  out.sort((a,b)=>(!a.active)-(!b.active) || (EMP_SORT[S.ef.sort]||byEmpNo)(a,b));
  $("#subtitle").textContent=`${S.emps.size} 位員工`;
  S.list.set(out,keep);
}
async function openEmp(id){

           S.sb.from("asset_assignments").select("*,assets(id,tag,name)").eq("employee_id",id).not("end_date","is",null).order("start_date",{ascending:false}).limit(200)]); used=ur.data||[]; }
    catch(err){ toast(dbErr(err),"err"); closeDrawer(); return; } }
  const v=e||{active:true}, ro=!isAdmin()?"disabled":"";
  const body=`<form class="form" id="ef" autocomplete="off"><fieldset style="display:contents" ${ro}>
    <label><span class="req">員工編號</span><input class="in" name="emp_no" required value="${esc(v.emp_no)}"></label>

    <label>部門<input class="in" name="dept" value="${esc(v.dept)}"></label>

    <label>Slack 成員 ID<input class="in" name="slack_id" value="${esc(v.slack_id)}" placeholder="U 開頭，例：U04ABCD123（選填，供日後自動通知使用）"></label>
    <label>在職狀態<select class="in" name="active"><option value="1" ${v.active?"selected":""}>在職</option><option value="0" ${v.active?"":"selected"}>已離職</option></select></label>
    <p class="full small muted" style="margin:0">填了 Email 的員工可以用這個 Email 登入系統，查看自己名下的設備並線上簽名；沒填的員工請使用下載的紙本簽收單。離職員工將無法再登入。</p>
  </fieldset></form>
  ${id?`<div class="sec">名下資產（${mine.length}）</div>
    ${mine.length?`<div class="list">${mine.map(a=>`<div class="li"><span class="tag">${esc(a.tag)}</span><span class="grow">${esc(a.name)}${a.assigned_date?`<span class="muted small">　${esc(a.assigned_date.replace(/-/g,"/"))} 領用</span>`:""}</span>${a.status==="borrowed"&&a.due_date?`<span class="due ${isOver(a)?"over":""}">應還 ${esc(a.due_date)}</span>`:""}<span class="st ${a.status}">${STATUS[a.status]}</span></div>`).join("")}</div>`:`<p class="muted small">目前沒有保管中的設備。</p>`}
    <div class="row" style="margin-top:10px">
      ${isAdmin()?`<button class="btn primary sm" data-act="newSo" data-id="${esc(id)}" data-type="issue" ${mine.length?"":"disabled"}>產生領用簽收單</button>
      <button class="btn sm" data-act="newSo" data-id="${esc(id)}" data-type="borrow" ${mine.some(a=>a.status==="borrowed")?"":"disabled"}>產生借用單</button>
      <button class="btn sm" data-act="newSo" data-id="${esc(id)}" data-type="return" ${mine.length?"":"disabled"}>產生歸還單</button>`:""}
      <button class="btn sm ghost" data-act="viewHolder" data-id="${esc(id)}">在資產總覽查看</button>
    </div>
    ${used.length?`<div class="sec">過去使用過的設備（${used.length}）</div><div class="list">${used.map(u=>`<div class="li"><span class="tag">${esc((u.assets||{}).tag||"")}</span><span class="grow">${esc((u.assets||{}).name||"")}<span class="muted small">　${u.kind==="borrow"?"借用":"領用"}</span></span><span class="num muted">${fmtD(u.start_date)} – ${fmtD(u.end_date)}</span></div>`).join("")}</div>`:""}

async function saveEmp(id){
  const f=$("#ef"); if(!f.reportValidity()) return;
  const fd=Object.fromEntries(new FormData(f).entries()); for(const k in fd) fd[k]=String(fd[k]).trim();
  const data={emp_no:fd.emp_no,name:fd.name,dept:fd.dept,email:fd.email?fd.email.toLowerCase():null,slack_id:fd.slack_id,active:fd.active==="1"};
  await run(()=> id ? q(S.sb.from("employees").update(data).eq("id",id)) : q(S.sb.from("employees").insert(data)), id?"已儲存員工資料":"已新增員工");
  closeDrawer(); await loadEmps(); updEmps(true);

function delEmp(id){
  const e=S.emps.get(id), n=(S.counts.get(id)||{}).assets||0;

  confirmBox(`刪除員工 ${e.name}？`,"員工資料將永久刪除，無法復原；過去的簽收單會保留。若只是離職，建議改為「已離職」即可。","刪除員工",async()=>{ await run(()=>q(S.sb.from("employees").delete().eq("id",id)),"已刪除員工"); closeDrawer(); await loadEmps(); updEmps(true); },true,e.emp_no);
}

/* ================= SIGNOFFS ================= */
function soStatus(s){
  if(s.voided) return {k:"void",label:"已作廢"};
  if(s.signed_at) return {k:"signed",label:"已簽收",at:s.signed_at};
  if(s.paper_signed_at) return {k:"paper",label:"紙本簽回",at:s.paper_signed_at};
  return {k:"pending",label:"待簽收"};
}
async function newSo(eid,type){
  const e=S.emps.get(eid);
  let mine=await run(()=>q(S.sb.from("assets").select("id,tag,name,status,due_date").eq("holder_id",eid).order("tag").limit(500)));
  if(type==="borrow") mine=mine.filter(a=>a.status==="borrowed");
  modal(`<h2>產生${SO_TYPE[type]}</h2><p class="muted small">${esc(e.name)}（${esc(e.emp_no)}）${e.email?"可以登入系統線上簽名。":"沒有 Email，請下載紙本給員工簽名。"}</p>
    <div class="list" id="soPick" style="max-height:340px;overflow:auto">${mine.map(a=>`<label class="li"><input type="checkbox" value="${esc(a.id)}" checked><span class="tag">${esc(a.tag)}</span><span class="grow">${esc(a.name)}</span>${a.due_date?`<span class="due">應還 ${esc(a.due_date)}</span>`:""}</label>`).join("")}</div>
    <div class="row" style="margin-top:16px;justify-content:flex-end"><button class="btn" data-close>取消</button><button class="btn primary" id="soGo">建立簽收單</button></div>`);
  $("#soGo").onclick=async()=>{
    const ids=[...document.querySelectorAll("#soPick input:checked")].map(x=>x.value);

function sigPad(cv){
  const W=600,H=200; let strokes=[],cur=null; const ctx=cv.getContext("2d");
  const fit=()=>{ const r=cv.getBoundingClientRect(),d=devicePixelRatio||1; cv.width=r.width*d; cv.height=r.height*d; redraw(); };
  const pt=e=>{ const r=cv.getBoundingClientRect(); return [Math.round((e.clientX-r.left)/r.width*W),Math.round((e.clientY-r.top)/r.height*H)]; };
  function redraw(){ ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0); ctx.clearRect(0,0,W,H); ctx.lineWidth=3.2; ctx.lineCap=ctx.lineJoin="round"; ctx.strokeStyle="#111";
    for(const s of strokes){ ctx.beginPath(); s.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y)); if(s.length===1) ctx.lineTo(s[0][0]+.1,s[0][1]); ctx.stroke(); } }
  cv.addEventListener("pointerdown",e=>{ e.preventDefault(); cv.setPointerCapture(e.pointerId); cur=[pt(e)]; strokes.push(cur); redraw(); });
  cv.addEventListener("pointermove",e=>{ if(!cur) return; const p=pt(e),l=cur[cur.length-1]; if(Math.abs(p[0]-l[0])+Math.abs(p[1]-l[1])>=2){ cur.push(p); redraw(); } });
  const end=()=>{cur=null;}; cv.addEventListener("pointerup",end); cv.addEventListener("pointercancel",end);
  new ResizeObserver(fit).observe(cv);
  return { clear(){strokes=[];redraw();}, empty(){return !strokes.some(s=>s.length>1);}, path(){ return {w:W,h:H,d:strokes.map(s=>"M"+s.map(p=>p.join(" ")).join("L")).join("")}; } };
}

  const data={dep_default_life:life, dep_life:map, dep_salvage_mode:f.dep_salvage_mode.value, dep_salvage_pct:Math.min(100,Math.max(0,Number(f.dep_salvage_pct.value)||0)), updated_at:new Date().toISOString()};

const STATUS_REV=Object.fromEntries(Object.entries(STATUS).map(([k,v])=>[v,k]));
function importCSV(kind){
  const isA=kind==="assets";
  modal(`<h2>匯入${isA?"資產":"員工"} CSV</h2><p class="small muted">第一列需為欄位名稱：${(isA?A_CSV.filter(c=>c[0]!=="保管人"&&c[1]!=="_last"):E_CSV).map(c=>c[0]).join("、")}。${isA?"「資產編號」相同的資料會更新，其餘新增；保管人以員工編號對應，請先匯入員工。":"「員工編號」相同的資料會更新，其餘新增。"}</p>
  <p class="small" style="margin:-4px 0 12px">第一次匯入？<button class="btn sm" data-act="csvTemplate" data-kind="${kind}">下載範本 CSV</button> 用 Excel 打開照格式填寫，存成 CSV 後再上傳。</p>
  <input type="file" accept=".csv,text/csv" id="csvf" class="in"><div class="small" id="csvInfo" style="margin-top:10px"></div><div class="prog hide" id="ip"><i></i></div>
  <div class="row" style="margin-top:16px;justify-content:flex-end"><button class="btn" data-close>取消</button><button class="btn primary" id="igo" disabled>開始匯入</button></div>`);
  let rows=[];
  $("#csvf").onchange=e=>{ const file=e.target.files[0]; if(!file) return;
    if(!window.Papa){ toast("CSV 元件載入失敗，請重新整理","err"); return; }
    Papa.parse(file,{header:true,skipEmptyLines:true,complete:r=>{
      rows=r.data.map(o=>{const x={}; for(const k in o) x[k.replace(/^\ufeff/,"").trim()]=String(o[k]??"").trim(); return x;});
      const key=isA?"資產編號":"員工編號"; rows=rows.filter(x=>x[key]);
      $("#csvInfo").textContent=rows.length?`讀到 ${rows.length.toLocaleString()} 筆資料。`:`找不到「${key}」欄位或資料為空。`; $("#igo").disabled=!rows.length; }}); };
  $("#igo").onclick=async()=>{
    $("#igo").disabled=true; $("#ip").classList.remove("hide");
    const byNo=new Map(Array.from(S.emps.values()).map(e=>[String(e.emp_no).toLowerCase(),e]));
    const dt=v=>/^\d{4}[-/]\d{1,2}[-/]\d{1,2}$/.test(v)?v.replace(/\//g,"-"):null;
    let recs, missing=0; const has=k=>rows.length && Object.prototype.hasOwnProperty.call(rows[0],k); const hasSince=has("領用日");
    if(isA){
      recs=rows.map(r=>{ const emp=r["保管人員工編號"]?byNo.get(r["保管人員工編號"].toLowerCase()):null; if(r["保管人員工編號"]&&!emp) missing++;
        let status=STATUS_REV[r["狀態"]]||(STATUS[r["狀態"]]?r["狀態"]:(emp?"in_use":"available"));
        const due=dt(r["預計歸還"]||""); if(status==="borrowed"&&!due) status=emp?"in_use":"available"; if(HELD.has(status)&&status!=="repair"&&!emp) status="available";
        return {tag:r["資產編號"],name:r["名稱"]||r["資產編號"],cat:r["類別"]||"其他",brand:r["品牌"]||"",model:r["型號"]||"",serial:r["序號"]||"",os:r["作業系統"]||"",status,
          holder_id:emp?emp.id:null,due_date:status==="borrowed"?due:null,location:r["存放位置"]||"",purchase_date:dt(r["購入日期"]||""),warranty_end:dt(r["保固到期"]||""),
          cost:r["購入金額"]?(Number(r["購入金額"].replace(/[^\d.]/g,""))||null):null,note:r["備註"]||"",
          ...(hasSince?{assigned_date:emp?dt(r["領用日"]||""):null}:{}),
          ...(has("供應商")?{vendor:r["供應商"]||""}:{}), ...(has("採購人")?{purchaser:r["採購人"]||""}:{}), ...(has("發票號碼")?{invoice_no:r["發票號碼"]||""}:{}),
          ...(has("耐用年數")?{life_years:(Number(r["耐用年數"])>0?Number(r["耐用年數"]):null)}:{}),
          ...(has("預估殘值")?{salvage:(r["預估殘值"]!==""&&!isNaN(Number(r["預估殘值"].replace(/[^\d.]/g,"")))&&r["預估殘值"].replace(/[^\d.]/g,"")!==""?Number(r["預估殘值"].replace(/[^\d.]/g,"")):null)}:{})}; });
    } else {
      recs=rows.map(r=>({emp_no:r["員工編號"],name:r["姓名"]||r["員工編號"],dept:r["部門"]||"",email:(r["Email"]||"").toLowerCase()||null,slack_id:r["Slack ID"]||"",active:r["在職"]?!/否|離職|no|false/i.test(r["在職"]):true}));
    }
    let done=0, fail=null;
    for(let i=0;i<recs.length;i+=500){
      const chunk=recs.slice(i,i+500);
      const {error}=await S.sb.from(isA?"assets":"employees").upsert(chunk,{onConflict:isA?"tag":"emp_no"});
      if(error){ fail=error; break; }
      done+=chunk.length; $("#ip i").style.width=(done/recs.length*100)+"%"; $("#csvInfo").textContent=`匯入中 ${done.toLocaleString()} / ${recs.length.toLocaleString()}`;
    }
    closeModal();
    if(fail) toast(`已匯入 ${done} 筆，其餘失敗：${dbErr(fail)}`,"err"); else toast(`已匯入 ${done.toLocaleString()} 筆${missing?`，${missing} 筆的保管人員工編號找不到，已設為在庫`:""}`);
    await loadEmps(); if(S.view==="assets") updAssets(); else if(S.view==="emps") updEmps();
  };
}

function modal(html){ $("#modal").innerHTML=html; $("#modal").classList.add("on"); $("#mscrim").classList.add("on"); }
function closeModal(){ $("#modal").classList.remove("on"); $("#mscrim").classList.remove("on"); $("#modal").innerHTML=""; }
function confirmBox(title,msg,label,fn,danger,typeText){
  modal(`<h2>${esc(title)}</h2><p class="muted">${esc(msg)}</p>
    ${typeText?`<p class="small" style="margin:14px 0 6px">為避免誤刪，請輸入 <b class="num" style="background:var(--surface-2);padding:1px 6px;border-radius:4px">${esc(typeText)}</b> 確認：</p><input class="in" id="cfType" autocomplete="off" spellcheck="false" placeholder="${esc(typeText)}">`:""}
    <div class="row" style="margin-top:16px;justify-content:flex-end"><button class="btn" data-close>取消</button><button class="btn ${danger?"danger":"primary"}" id="cfGo" ${typeText?"disabled":""}>${esc(label)}</button></div>`);
  const ok=()=>!typeText || $("#cfType").value.trim().toLowerCase()===String(typeText).trim().toLowerCase();
  if(typeText){ const inp=$("#cfType"); inp.addEventListener("input",()=>{ $("#cfGo").disabled=!ok(); }); inp.addEventListener("paste",e=>e.preventDefault()); setTimeout(()=>inp.focus(),30); }
  $("#cfGo").onclick=async()=>{ if(!ok()) return; $("#cfGo").disabled=true; try{ await fn(); closeModal(); }catch{ $("#cfGo").disabled=!ok(); } };
}

  const nv=e.target.closest("[data-view]"); if(nv){ go(nv.dataset.view); return; }
  if(e.target.closest("[data-close]")){ if(e.target.closest("#modal")) closeModal(); else closeDrawer(); return; }
  const cc=e.target.closest("[data-cat]"); if(cc&&cc.classList.contains("chip")){ S.f.cat=cc.dataset.cat; updAssets(); return; }
  const ch=e.target.closest("[data-status]"); if(ch){ S.f.status=ch.dataset.status; S.f.overdue=false; updAssets(); return; }
  const od=e.target.closest("[data-overdue]"); if(od){ S.f.overdue=!S.f.overdue; S.f.status=""; updAssets(); return; }
  const sc=e.target.closest("[data-sost]"); if(sc){ S.sf.st=sc.dataset.sost; updSos(); return; }
  const rc=e.target.closest("[data-rst]"); if(rc){ S.rf.st=rc.dataset.rst; updRepairs(); return; }
  const b=e.target.closest("[data-act]"); if(!b) return;
  const id=b.dataset.id;
  try{ switch(b.dataset.act){
    case "logout": await S.sb.auth.signOut(); location.reload(); break;
    case "newAsset": openAsset(null); break;
    case "saveAsset": saveAsset(id||null); break;
    case "delAsset": delAsset(id); break;
    case "coverPhoto": coverPhoto(+b.dataset.i); break;
    case "delPhoto": confirmBox("刪除這張照片？","照片刪除後無法復原。","刪除照片",()=>delPhoto(+b.dataset.i),true); break;
    case "newEmp": openEmp(null); break;
    case "saveEmp": saveEmp(id||null); break;
    case "delEmp": delEmp(id); break;
    case "newSo": newSo(id,b.dataset.type); break;
    case "openSo": openSo(id); break;
    case "viewHolder": S.f={...S.f,holder:id,q:"",status:"",overdue:false}; go("assets"); break;
    case "clearHolder": S.f.holder=""; updAssets(); break;
    case "bulkInventory": bulkInventory(); break;
    case "dlSo": dlSo(soCache); break;
    case "printSo": printSo(soCache); break;
    case "dlMine": dlSo(await soFull(id)); break;
    case "copySlack": copyText(slackMsg(soCache),"已複製 Slack 通知訊息"); break;
    case "copyAllSlack": copyAllSlack(); break;
    case "paperSigned": confirmBox("標記為紙本已簽回？","請確認已收到員工親筆簽名的紙本簽收單並歸檔。","標記已簽回",async()=>{ await run(()=>q(S.sb.from("signoffs").update({paper_signed_at:new Date().toISOString()}).eq("id",id)),"已標記為紙本簽回"); refreshCounts(); updSos(true); openSo(id); }); break;
    case "voidSo": confirmBox("作廢這張簽收單？","作廢後員工將無法再簽署此單，紀錄會保留。","作廢",async()=>{ await run(()=>q(S.sb.from("signoffs").update({voided:true}).eq("id",id)),"已作廢"); refreshCounts(); updSos(true); openSo(id); },true); break;
    case "delSo": confirmBox("刪除這張簽收單？","已作廢的簽收單將永久刪除，無法復原。","刪除",async()=>{ await run(()=>q(S.sb.from("signoffs").delete().eq("id",id)),"已刪除"); closeDrawer(); updSos(true); },true,soCache&&soCache.no); break;
    case "signSo": signSo(id); break;
    case "saveCfg": saveCfg(); break;
    case "addRole": addRole(); break;
    case "delRole": delRole(b.dataset.email); break;
    case "exportAssets": exportAssets(); break;
    case "exportEmps": exportEmps(); break;
    case "exportSos": exportSos(); break;
    case "backup": backup(); break;
    case "newRepair": openRepair(null,id); break;
    case "openRepair": openRepair(id); break;
    case "pickRepairAsset": pickRepairAsset(); break;
    case "exportRepairs": exportRepairs(); break;
    case "exportValues": exportValues(); break;
    case "saveDep": saveDep(); break;
    case "importAssets": importCSV("assets"); break;
    case "importEmps": importCSV("emps"); break;
    case "csvTemplate": csvTemplate(b.dataset.kind); break;
    case "sendLink": sendLink(); break;
    case "verifyOtp": verifyOtp(); break;
    case "slackLogin": S.sb.auth.signInWithOAuth({provider:"slack_oidc",options:{redirectTo:location.origin+location.pathname}}); break;
  } }catch(err){ console.error(err); }
});
$("#scrim").addEventListener("click",closeDrawer);
$("#mscrim").addEventListener("click",closeModal);
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ if($("#lightbox").classList.contains("on")) $("#lightbox").classList.remove("on"); else if($("#modal").classList.contains("on")) closeModal(); else closeDrawer(); } if(e.key==="Enter"&&e.target.id==="loginEmail") sendLink(); if(e.key==="Enter"&&e.target.id==="otp") verifyOtp(); });
mobile.addEventListener("change",()=>{ if(S.list) S.list.draw(); });

/* ================= login & boot ================= */
function screen(html){ $("#root").innerHTML=`<div class="login"><div class="login-box"><div class="brand-mark" aria-hidden="true"></div>${html}</div></div>`; }
function loginScreen(msg){
  screen(`<h1>設備資產管理</h1><p class="muted small" style="margin:0 0 14px">請用公司 Email 登入，系統會寄一組驗證碼到你的信箱。</p>
    ${msg?`<p class="small" style="color:var(--red)">${esc(msg)}</p>`:""}
    <input class="in" id="loginEmail" type="email" placeholder="name@company.com" autocomplete="email">
    <button class="btn primary" data-act="sendLink" id="sendBtn">寄送驗證碼</button>
    ${C.SLACK_LOGIN?`<div class="or">或</div><button class="btn" data-act="slackLogin">使用 Slack 登入</button>`:""}`);
  setTimeout(()=>$("#loginEmail")&&$("#loginEmail").focus(),50);
}
async function sendLink(){
  const email=$("#loginEmail").value.trim().toLowerCase();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ toast("請輸入正確的 Email","err"); return; }
  $("#sendBtn").disabled=true;
  const {error}=await S.sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});
  if(error){ $("#sendBtn").disabled=false; toast(/rate|limit/i.test(error.message)?"寄信太頻繁，請稍候幾分鐘再試":"寄送失敗："+error.message,"err"); return; }
  S.loginEmail=email;
  screen(`<h1>請到信箱收信</h1><p class="muted small" style="margin:0 0 14px">已寄到 <b>${esc(email)}</b>。輸入信中的驗證碼，或直接點信中的登入連結。</p>
    <input class="in" id="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="驗證碼" style="font:600 22px var(--f-code);letter-spacing:.25em;text-align:center">
    <button class="btn primary" data-act="verifyOtp" id="otpBtn">登入</button>
    <p class="small muted" style="margin-top:14px">沒收到的話，請看一下垃圾郵件匣。</p><button class="btn ghost" onclick="location.reload()">重新輸入 Email</button>`);
  setTimeout(()=>$("#otp")&&$("#otp").focus(),50);
}
async function verifyOtp(){
  const token=($("#otp").value||"").replace(/\D/g,"");
  if(token.length<6){ toast("請輸入完整的驗證碼","err"); return; }
  $("#otpBtn").disabled=true;
  const {error}=await S.sb.auth.verifyOtp({email:S.loginEmail,token,type:"email"});
  if(error){ $("#otpBtn").disabled=false; toast(/expired|invalid/i.test(error.message)?"驗證碼錯誤或已過期，請重新寄送":"登入失敗："+error.message,"err"); return; }
  location.reload();
}
async function boot(){
  if(!C.SUPABASE_URL || /YOUR-PROJECT/.test(C.SUPABASE_URL) || !window.supabase){
    screen(`<h1>尚未完成設定</h1><p class="muted">請依照 README 的步驟，在 <code>config.js</code> 填入 Supabase 專案網址與 anon key。</p>`); return;
  }
  S.sb = supabase.createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY, {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  const {data:{session}} = await S.sb.auth.getSession();
  const hashErr = new URLSearchParams(location.hash.slice(1)).get("error_description");
  if(!session){ loginScreen(hashErr?"登入連結已失效，請重新寄送":""); return; }
  if(location.hash) history.replaceState(null,"",location.pathname+location.search);
  S.sb.auth.onAuthStateChange(ev=>{ if(ev==="SIGNED_OUT") location.reload(); });
  let who; try{ who=await q(S.sb.rpc("whoami")); }catch(e){ screen(`<h1>無法連線</h1><p class="muted">${esc(dbErr(e))}</p><button class="btn" onclick="location.reload()">重新整理</button>`); return; }
  S.email=who.email; S.role=who.role; S.me=who.employee;
  if(!S.role){ screen(`<h1>尚未開通</h1><p class="muted">${esc(S.email)} 還沒有使用權限。請通知行政部在員工資料中填入你的公司 Email。</p><button class="btn" data-act="logout">改用其他 Email 登入</button>`); return; }
  try{ const [cfg]=await Promise.all([q(S.sb.from("settings").select("*").eq("id",1).single()), loadEmps()]); S.cfg=cfg; }
  catch(e){ toast(dbErr(e),"err"); }
  shell(); await refreshCounts();
  go(isStaff()?"assets":"mine");
}
boot();
})();
</script>
