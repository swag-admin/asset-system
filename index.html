<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SWAG 行政平台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2300A393'/%3E%3Ctext x='16' y='22' font-size='17' font-family='Arial' font-weight='700' fill='white' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;600;700&display=swap">
<script src="js/theme.js"></script>
<style>
:root{--bg:#f5f6fa;--surface:#fff;--sunken:#f3f5f9;--line:#e6e9f0;--fg:#1b2233;--muted:#6b7488;--accent:#0f8a78;--accent-2:#14b8a6;--accent-soft:#e6f6f3;--danger:#d9485f;--danger-soft:#fdecef;--warn:#c47a0b;--warn-soft:#fff5e3;--done:#16a34a;--done-soft:#e8f7ee;--blue:#3b6fe0;--blue-soft:#eaf0fd;--violet:#7c5cd6;--violet-soft:#f1ecfc;--rose:#e0567a;--rose-soft:#fdeef3;--amber:#e09a1c;--amber-soft:#fff4df;--r:14px;--shadow:0 1px 2px rgba(20,30,60,.04),0 4px 14px rgba(20,30,60,.05);--hd:58px}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 "Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}
input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.note{color:var(--muted);font-size:12.5px}
header{background:linear-gradient(120deg,#0b4f46 0%,#0f766e 55%,#13a08d 100%);position:sticky;top:0;z-index:30;box-shadow:0 2px 10px rgba(11,79,70,.18)}
.hd{max-width:1320px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px;min-height:var(--hd)}
.brand{font-weight:700;font-size:17px;display:flex;align-items:center;gap:10px;color:#fff;letter-spacing:.3px;white-space:nowrap;border:0;background:none;padding:0}
.brand i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#fff 0%,#c8f3ea 100%);display:inline-grid;place-items:center;color:#0f766e;font-style:normal;font-weight:800;font-size:15px}
nav{display:flex;gap:4px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
nav::-webkit-scrollbar{display:none}
nav button{border:0;background:none;padding:7px 13px;border-radius:999px;color:rgba(255,255,255,.8);font-weight:500;white-space:nowrap;transition:background .15s}
nav button:hover{background:rgba(255,255,255,.12);color:#fff}
nav button[aria-current=true]{background:#fff;color:#0f766e;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.me{display:flex;align-items:center;gap:8px;font-size:13px;color:rgba(255,255,255,.88);position:relative}
.av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#ffd27a,#f59e8b);color:#5a2a14;display:grid;place-items:center;font-size:12px;font-weight:700;box-shadow:0 0 0 2px rgba(255,255,255,.6);border:0;padding:0}
.menu{position:absolute;right:0;top:40px;background:#fff;color:var(--fg);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(20,30,60,.15);padding:8px;min-width:220px;z-index:40}
.menu .who{padding:6px 10px 10px;border-bottom:1px solid var(--line);margin-bottom:6px;font-size:13px}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:8px}
.menu button:hover{background:var(--sunken)}
main{max-width:1320px;margin:0 auto;padding:24px 16px 60px}
main.frame{max-width:none;padding:0}
.view-frame{display:block;width:100%;height:calc(100vh - var(--hd));border:0;background:var(--bg)}
.view-frame.with-sub{height:calc(100vh - var(--hd) - 56px)}
.frame-sub{height:56px;display:flex;align-items:center;max-width:1320px;margin:0 auto;padding:0 16px}
.frame-sub .subtabs{margin:0}
h2{font-size:20px;margin:0;letter-spacing:.2px}
.hello{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.hello h2{font-size:22px}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.toolbar .sp{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:10px;box-shadow:0 1px 1px rgba(20,30,60,.03);transition:border-color .15s;white-space:nowrap}
.btn:hover{border-color:#c9cfdc}
.btn:disabled{opacity:.55;cursor:default}
.btn.primary{background:linear-gradient(135deg,#0f8a78,#14b8a6);border-color:transparent;color:#fff;box-shadow:0 3px 10px rgba(15,138,120,.25)}
.btn.danger{color:var(--danger)}
.btn.small{padding:3px 10px;font-size:12.5px;border-radius:8px}
.btn.link{border:0;background:none;box-shadow:none;color:var(--accent);padding:2px 4px;font-weight:600}
.chip{display:inline-block;font-size:11.5px;padding:2px 9px;border-radius:999px;background:var(--sunken);color:var(--muted);white-space:nowrap;font-weight:500}
.chip.red{background:var(--danger-soft);color:var(--danger)}.chip.amber{background:var(--warn-soft);color:var(--warn)}.chip.green{background:var(--done-soft);color:var(--done)}.chip.teal{background:var(--accent-soft);color:var(--accent)}.chip.blue{background:var(--blue-soft);color:var(--blue)}.chip.violet{background:var(--violet-soft);color:var(--violet)}
.grid{display:grid;gap:16px}
.g3{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--mc,var(--accent))}
.card h3{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.card h3 .go{margin-left:auto;font-size:12.5px;color:var(--mc,var(--accent));border:0;background:none;font-weight:600}
.m-legal{--mc:var(--rose)}
.info-wrap{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px;align-items:start}
.info-side{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;box-shadow:var(--shadow);position:sticky;top:calc(var(--hd) + 16px)}
.info-side h4{font-size:12px;color:var(--muted);margin:10px 8px 4px;font-weight:600}
.info-side button.pg{display:flex;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:8px;gap:6px;align-items:center}
.info-side button.pg:hover{background:var(--sunken)}.info-side button.pg[aria-current=true]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.info-main{min-width:0}
.info-frame{width:100%;height:calc(100vh - var(--hd) - 150px);min-height:480px;border:1px solid var(--line);border-radius:var(--r);background:#fff}
.info-main.full .info-frame{position:fixed;inset:var(--hd) 0 0 0;height:auto;z-index:25;border-radius:0}
.md{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 24px;box-shadow:var(--shadow);line-height:1.8}
.md h3{font-size:18px;margin:14px 0 6px}.md h4{font-size:15px;margin:12px 0 4px}.md ul{margin:4px 0;padding-left:22px}.md p{margin:6px 0}
@media (max-width:820px){.info-wrap{grid-template-columns:1fr}.info-side{position:static}}.m-doc{--mc:#0e7490}.k-doc{--mcs:#e0f2f7}
li.click{cursor:pointer;border-radius:6px}li.click:hover .t{color:var(--accent)}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.person{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.person .ph{display:flex;align-items:center;gap:8px}.person .dot{width:10px;height:10px;border-radius:50%}
.load{height:5px;background:var(--sunken);border-radius:99px;overflow:hidden}.load i{display:block;height:100%;background:linear-gradient(90deg,#0f8a78,#14b8a6)}.m-contract{--mc:var(--blue)}.m-work{--mc:var(--accent)}.m-pt{--mc:var(--amber)}.m-asset{--mc:var(--violet)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);display:grid;grid-template-columns:auto 1fr;gap:2px 12px;align-items:center;text-align:left}
button.kpi:hover{border-color:#c9cfdc}
.kpi .ic{grid-row:span 2;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:19px;background:var(--mcs,var(--accent-soft))}
.kpi b{font-size:24px;font-weight:700;line-height:1.1}.kpi b.red{color:var(--danger)}.kpi b.amber{color:var(--warn)}
.kpi span{font-size:12.5px;color:var(--muted)}
.k-legal{--mcs:var(--rose-soft)}.k-journey{--mcs:#ffedd5}.m-journey{--mc:#ea580c}.k-contract{--mcs:var(--blue-soft)}.k-work{--mcs:var(--accent-soft)}.k-pt{--mcs:var(--amber-soft)}.k-asset{--mcs:var(--violet-soft)}
ul.plain{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
ul.plain li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:baseline}
ul.plain li .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%}
th,td{padding:10px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;background:#f8f9fc;white-space:nowrap;letter-spacing:.3px}
tr.click{cursor:pointer}tr.click:hover td{background:#f6faff}
tr:last-child td{border-bottom:0}
tr.done td{color:var(--muted)}tr.done .ttl{text-decoration:line-through}tr.jdone td{color:var(--muted)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filters select,.filters input,.fld input,.fld select,.fld textarea{padding:7px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.filters input{min-width:220px}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(20,184,166,.35);border-color:var(--accent-2)}
.banner{background:linear-gradient(90deg,#eaf7f4,#f2faf8);border:1px solid #cdebe4;color:#0d5c51;border-radius:12px;padding:11px 15px;margin-bottom:16px;font-size:13px}
.banner.warn{background:linear-gradient(90deg,#fff4df,#fff9ee);border-color:#f3d9a6;color:#7d4f06}
.banner.err{background:var(--danger-soft);border-color:#f5c2cb;color:#9b1c33}
.drawer{position:fixed;inset:0;background:rgba(20,26,45,.38);backdrop-filter:blur(2px);display:flex;justify-content:flex-end;z-index:50}
.drawer .panel{background:var(--surface);width:min(560px,100%);height:100%;overflow:auto;padding:22px 24px;display:flex;flex-direction:column;gap:12px;box-shadow:-10px 0 30px rgba(20,30,60,.12)}
.drawer .panel.wide{width:min(760px,100%)}
.drawer .panel>*{flex-shrink:0}
.drawer .hdr{display:flex;align-items:center;gap:10px}.drawer .hdr h2{flex:1;font-size:18px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.fld>input,.fld>select,.fld>textarea{width:100%}
.fld input,.fld select,.fld textarea{color:var(--fg);font-size:14px}
.fld textarea{min-height:80px;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;gap:8px;align-items:center;font-size:13.5px}
.timeline{list-style:none;padding:0;margin:0;border-left:2px solid var(--line);margin-left:6px}
.timeline li{position:relative;padding:0 0 10px 18px;font-size:13px}
.timeline li::before{content:"";position:absolute;left:-7px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--line);box-shadow:0 0 0 3px #fff}
.timeline li.past::before{background:var(--done)}.timeline li.next::before{background:var(--amber)}.timeline li.esc::before{background:var(--danger)}
.foot{display:flex;gap:8px;align-items:center;margin-top:auto;padding-top:12px;border-top:1px solid var(--line)}
.foot .sp{flex:1}
.perm td,.perm th{text-align:center;padding:8px 8px}.perm td:first-child,.perm th:first-child{text-align:left}
.perm select{font-size:12.5px;padding:4px 6px;border-radius:8px;border:1px solid var(--line);background:#fff}
.perm input{font-size:12.5px;padding:4px 8px;border-radius:8px;border:1px solid var(--line);width:100%}
.perm select.v-管理,.perm select.v-正職,.perm select.v-是{color:var(--accent);font-weight:600}
.perm select.v-編輯,.perm select.v-PT{color:var(--blue)}
.perm select.v-部門{color:var(--warn);font-weight:600}
.perm select.v-—{color:#aab}
.perm tr.dirty td{background:#fffcf3}
.subtabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.subtabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px}
.subtabs button[aria-current=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.empty{padding:28px;text-align:center;color:var(--muted)}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(1200px 500px at 20% -10%,#d6f3ec 0%,transparent 60%),radial-gradient(900px 500px at 110% 110%,#e6e8fb 0%,transparent 60%)}
.login .box{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:36px 30px;width:min(400px,100%);text-align:center;display:flex;flex-direction:column;gap:16px;align-items:center;box-shadow:0 20px 50px rgba(20,30,60,.10)}
.login .brand{color:var(--fg);font-size:20px}.login .brand i{background:linear-gradient(135deg,#0f766e,#14b8a6);color:#fff}
#gbtn{min-height:44px}
.overlay-login{position:fixed;inset:0;z-index:100;background:rgba(245,246,250,.92)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1b2233;color:#fff;padding:9px 16px;border-radius:10px;font-size:13px;z-index:200;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.mailprev{width:100%;height:520px;border:1px solid var(--line);border-radius:12px;background:#fff}
.dl{display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:13.5px}
.dl dt{color:var(--muted)}.dl dd{margin:0}
@media (max-width:720px){.row2{grid-template-columns:1fr}.hd{gap:10px}.brand span{display:none}.filters input{min-width:0;flex:1}}

/* ===== 左側選單版（beta） ===== */
:root{--hd:0px;--sbw:236px}
header{position:fixed;left:0;top:0;bottom:0;width:var(--sbw);background:linear-gradient(180deg,#0b4f46 0%,#0d655d 100%);box-shadow:none;z-index:30}
header .hd{flex-direction:column;align-items:stretch;height:100%;padding:16px 10px 10px;gap:6px;max-width:none;min-height:0}
header .brand{padding:2px 8px 10px}
nav{flex-direction:column;overflow-y:auto;overflow-x:hidden;flex:1;gap:2px}
nav .grp{font-size:11.5px;color:#8fd0c4;margin:12px 12px 4px;letter-spacing:1px}
nav button{display:flex;align-items:center;gap:10px;text-align:left;border-radius:10px;padding:8px 12px;color:rgba(255,255,255,.86);flex:none}
nav button i{font-style:normal;width:20px;text-align:center;flex:none}
nav button[aria-current=true]{background:rgba(255,255,255,.17);color:#fff;box-shadow:none;font-weight:600}
nav button.sub{padding:5px 12px 5px 42px;font-size:13px;color:#a7dccf}
nav button.sub[aria-current=true]{background:rgba(255,255,255,.1);color:#fff;font-weight:500}
header .me{border-top:1px solid rgba(255,255,255,.12);padding:10px 6px 2px;cursor:pointer}
.mename{display:flex;flex-direction:column;font-size:13px;color:#fff;line-height:1.35;min-width:0}.mename small{color:#8fd0c4;font-size:11.5px}
header .menu{top:auto;bottom:48px;left:0;right:auto}
#app main{margin:0 0 0 var(--sbw);max-width:none;padding:24px 28px 60px}
#app main.frame{padding:0}
.frame-sub{max-width:none;padding:0 20px}
.mtop,.scrim{display:none}
@media(max-width:860px){
 :root{--hd:52px}
 header{transform:translateX(-100%);transition:transform .2s;width:252px}
 body.navopen header{transform:none}
 body.navopen .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25}
 .mtop{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20;height:52px;padding:0 12px;background:linear-gradient(90deg,#0b4f46,#0f766e);color:#fff;font-weight:600}
 .mtop button{background:none;border:0;color:#fff;font-size:22px;padding:4px 6px}
 #app main{margin-left:0;padding:16px 14px 60px}
 header .brand span{display:inline!important}
}
button,input,select,textarea{font-family:inherit}

/* ===== SWAG 新版介面（配色由 js/theme.js 設定 --pri / --pink / --side） ===== */
:root{
  --pri:#00A393;--pink:#00CDB8;--side:#0B0F10;--side2:#151B1C;--grad:linear-gradient(135deg,var(--pink) 0%,var(--pri) 100%);
  --pri-soft:color-mix(in srgb,var(--pri) 11%,#fff);--pri-soft2:color-mix(in srgb,var(--pri) 6%,#fff);--pri-line:color-mix(in srgb,var(--pri) 32%,#fff);
  --bg:#F5F4FA;--surface:#fff;--sunken:#F8F7FC;--line:#ECE9F4;--fg:#1E1B2E;--muted:#6E6A85;
  --accent:var(--pri);--accent-2:var(--pink);--accent-soft:var(--pri-soft);
  --r:16px;--shadow:0 1px 2px rgba(30,27,46,.04),0 8px 24px rgba(30,27,46,.06);--sbw:248px;--hd:64px;
}
body{background:var(--bg);color:var(--fg);font-family:"Huninn","jf-openhuninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}

/* 側邊欄 */
header{background:linear-gradient(180deg,var(--side),var(--side2))!important;color:#C9C4E3}
header .hd{padding:0 0 0;gap:0}
header .brand{padding:20px 20px 16px;gap:10px;flex-direction:row;align-items:center}
header .brand i,.login .brand i{width:36px;height:36px;border-radius:11px;background:var(--grad);color:#fff;font-size:15px;font-weight:800;box-shadow:0 6px 18px color-mix(in srgb,var(--pink) 35%,transparent)}
header .brand span{display:flex;flex-direction:column;align-items:flex-start;line-height:1.25;font-size:16px;color:#fff;letter-spacing:.3px}
header .brand span small{font-size:11px;font-weight:400;color:#8E88AE;letter-spacing:0}
nav{padding:4px 12px 16px;gap:0}
nav::-webkit-scrollbar{display:block;width:6px}nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:6px}
nav .grp{font-size:11px;color:#6F6994;letter-spacing:1px;margin:16px 10px 6px}
nav button{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:#C9C4E3;margin:2px 0;font-size:13.5px;font-weight:400;transition:.15s}
nav button:hover{background:rgba(255,255,255,.06);color:#fff}
nav button i{width:18px;height:18px;display:grid;place-items:center;color:inherit}
nav button i svg{width:18px;height:18px}
nav button[aria-current=true]{background:var(--grad);color:#fff;font-weight:500;box-shadow:0 6px 16px color-mix(in srgb,var(--pri) 35%,transparent)}
nav button[aria-current=true] i{color:#fff}
nav button.sub{padding:6px 12px 6px 40px;font-size:13px;color:#8E88AE;box-shadow:none}
nav button.sub:hover{color:#fff}
nav button.sub[aria-current=true]{background:rgba(255,255,255,.08);color:#fff;box-shadow:none}
nav .bdg,nav button b.n{background:var(--pink)!important;color:#fff!important}
nav a.ext{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:#C9C4E3;margin:2px 0;font-size:13.5px;text-decoration:none;transition:.15s}
nav a.ext:hover{background:rgba(255,255,255,.06);color:#fff}
nav a.ext i{width:18px;height:18px;display:grid;place-items:center;font-style:normal}nav a.ext i svg{width:18px;height:18px}
nav a.ext .go{margin-left:auto;opacity:.45;display:grid}nav a.ext .go svg{width:15px;height:15px}
/* 每月固定事項 */
.mo-head{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:16px}
.mo-month{display:flex;align-items:center;gap:10px}.mo-month b{font-size:17px;min-width:110px;text-align:center}

<script>
(function () {
"use strict";
const $ = s => document.querySelector(s);
const C = window.PF_CONFIG || {};
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const ymd = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const today = () => ymd(new Date());
const daysLeft = (d, t) => Math.round((new Date(d + "T00:00:00") - new Date((t || today()) + "T00:00:00")) / 86400000);
const showDate = d => { if (!d) return "—"; const [y, m, dd] = d.split("-"); return (y === String(new Date().getFullYear()) ? "" : y + "/") + Number(m) + "/" + Number(dd); };
const addDays = (d, n) => { const x = new Date(d + "T00:00:00"); x.setDate(x.getDate() + n); return ymd(x); };
const WD = "日一二三四五六";
function toast(m) { const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2800); }
function dayChip(d) {
  if (d == null || isNaN(d)) return '<span class="chip">—</span>';
  if (d < 0) return `<span class="chip red">逾期 ${-d} 天</span>`;
  if (d === 0) return '<span class="chip red">今天</span>';
  if (d <= 7) return `<span class="chip amber">剩 ${d} 天</span>`;
  if (d <= 30) return `<span class="chip blue">剩 ${d} 天</span>`;
  return `<span class="chip">剩 ${d} 天</span>`;
}

/* ================= 狀態 ================= */
let ME = null;           // {email,name,perm,isOwner,settings}
let view = "home";
const frames = {};       // 已載入的 iframe

const isFT = p => p.work === "正職";
const MODULES = [
  {id: "home", name: "首頁", show: () => true},
  {id: "work", name: p => isFT(p) ? "工作台" : "我的工作", show: p => p.work !== "—"},
  {id: "pt", name: "PT 排班", show: p => p.work !== "—"},
  {id: "sop", name: "SOP", show: p => p.work !== "—"},
  {id: "vendors", name: "廠商資訊", show: p => p.work !== "—"},
  {id: "mail", name: "郵件收發", show: p => p.work !== "—"},
  {id: "contracts", name: "合約管理系統", show: p => p.contracts !== "—"},
  {id: "docs", name: "函文", hidden: true, show: p => p.docs !== "—"},
  {id: "legal", name: "法務期限", hidden: true, show: p => p.legal !== "—"},
  {id: "journey", name: "員工旅程", show: p => !!p.journey && p.journey !== "—"},
  {id: "info", name: "行政資料", show: p => p.isAdmin || (ME && ME.info > 0)},
  {id: "assets", name: "資產管理系統", show: p => p.assets !== "—"},
  {id: "settings", name: "權限設定", show: p => p.isAdmin},

let loginWaiter = null;
async function onCredential(token) {

    if (r.denied) { $("#loginMsg").innerHTML = `<b>${esc(r.email)}</b> 尚未開通平台權限，請聯絡行政（Eva）。`; return; }

async function boot() {
  if (!PF.hasSession()) return showLogin();
  // 用上次的登入資料先開畫面，同時向後端確認（權限有變就更新選單）
  let cached = null;
  try { cached = JSON.parse(localStorage.getItem("pf_me") || "null"); } catch (e) {}
  if (cached && cached.email) { ME = cached; startApp(); }
  try {
    const fresh = await PF.call("pf_apiMe");
    const changed = !ME || JSON.stringify(fresh.perm) !== JSON.stringify(ME.perm) || fresh.email !== ME.email;
    ME = fresh;
    try { localStorage.setItem("pf_me", JSON.stringify(fresh)); } catch (e) {}
    if (!cached) startApp(); else if (changed) { renderNav(); route(); }
  } catch (e) {
    if (!cached) showLogin(esc(e.message));
  }
}

function showFrame(id) {

  let f = frames[key];
  if (!f) {
    f = document.createElement("iframe");
    f.className = "view-frame";
    f.title = {work: "工作台", contracts: "合約庫", assets: "設備資產"}[key];
    const src = {work: "work.html", contracts: "contracts.html", assets: (C.ASSET_URL || "../asset-system/") + "?embed"}[key];
    $("#main").appendChild(f);
    frames[key] = f;
    // 設備資產：先用平台的 Google 登入換成設備資產的登入，再打開，就不用再收一次登入信
    if (key === "assets") { f.dataset.src = src; assetAutoLogin(f, src); } else f.src = src;
  } else if (key === "assets" && f.src) sbSession().then(sb => { if (!sb && view === "assets") assetLoginBar(f, f.dataset.src); });
  // 工作台設定：上面放一排設定分頁，方便回到平台的權限設定
  if (id === "worksettings" && ME.perm.isAdmin) { const bar = document.createElement("div"); bar.className = "frame-sub"; bar.innerHTML = settingsTabs("work"); $("#main").insertBefore(bar, f); f.classList.add("with-sub"); }

  else f.classList.remove("with-sub");

/** 整合系統（別的 Apps Script 網頁）：直接嵌在平台裡；被擋住時可以改用新分頁開 */

/** 上傳前先縮小：原圖最長邊 1600px、縮圖 120px（縮圖存在試算表，列表直接顯示） */
function moShrink(file, max, q) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("讀不到這張圖片")); };
    img.src = url;
  });
}

const personName = e => { if (!e) return "未指定"; const p = (LG.people || []).find(x => x.email === e); return p ? p.name : e.split("@")[0]; };
function legalTable() {
  const t = today(), q = lgFilter.q.trim().toLowerCase();
  let rows = LG.rows.map(r => Object.assign(r, {days: r.due ? daysLeft(r.due, t) : null}));
  rows = rows.filter(r => {
    const done = r.status === "已完成";
    if (lgFilter.status === "open" && done) return false;
    if (lgFilter.status === "done" && !done) return false;
    if (lgFilter.status === "soon" && (done || r.days > 30)) return false;
    if (lgFilter.cat && r.category !== lgFilter.cat) return false;
    if (lgFilter.owner === "me" && r.owner !== ME.email) return false;
    if (q && !(r.title + " " + r.note + " " + r.category).toLowerCase().includes(q)) return false;
    return true;

function mdHtml(t) {
  const inline = x => esc(x).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  let out = "", inList = false;
  String(t || "").split("\n").forEach(l => {
    const li = l.match(/^\s*[-*]\s+(.*)/);
    if (li) { if (!inList) { out += "<ul>"; inList = true; } out += `<li>${inline(li[1])}</li>`; return; }
    if (inList) { out += "</ul>"; inList = false; }
    if (/^##\s+/.test(l)) out += `<h4>${inline(l.replace(/^##\s+/, ""))}</h4>`;
    else if (/^#\s+/.test(l)) out += `<h3>${inline(l.replace(/^#\s+/, ""))}</h3>`;
    else if (l.trim()) out += `<p>${inline(l)}</p>`;
  });
  return out + (inList ? "</ul>" : "");
}

/* ================= 設備資產（Supabase） ================= */
let _sb = null;
function loadScript(src) { return new Promise((res, rej) => { const x = document.createElement("script"); x.src = src; x.onload = res; x.onerror = () => rej(new Error("無法載入 " + src)); document.head.appendChild(x); }); }
/** 跟設備資產系統共用同一個登入（同網域，Supabase 的登入資料存在 localStorage） */
async function sbClient() {
  if (!C.SUPABASE_URL || !C.SUPABASE_ANON_KEY) return null;
  if (_sb) return _sb;
  if (!window.supabase) await loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js");
  _sb = supabase.createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY, {auth: {persistSession: true, autoRefreshToken: false, detectSessionInUrl: false}});
  return _sb;
}
/** 用平台登入時的 Google 帳號直接登入設備資產（Supabase 的 Google 登入要先開啟，見說明） */
let assetLoginErr = "";
async function assetSignIn(interactive) {
  const sb = await sbClient(); if (!sb) return null;
  try { const {data: {session}} = await sb.auth.getSession(); if (session) return sb; } catch (e) {}
  const t = await PF.getIdToken(interactive);
  if (!t) { assetLoginErr = ""; return null; }
  const {error} = await sb.auth.signInWithIdToken({provider: "google", token: t.token, nonce: t.nonce});
  if (error) { assetLoginErr = error.message || String(error); console.warn("設備資產 Google 登入失敗", error); return null; }
  assetLoginErr = "";
  return sb;
}
async function assetAutoLogin(f, src) {
  const wait = document.createElement("div");
  wait.className = "empty asset-wait"; wait.innerHTML = '<span class="spin"></span> 正在登入設備資產…';
  $("#main").insertBefore(wait, f);
  const ok = await assetSignIn(false);
  wait.remove();
  f.src = src;
  if (!ok) assetLoginBar(f, src);
}
function assetLoginBar(f, src) {
  if (document.querySelector(".asset-bar")) return;
  const bar = document.createElement("div");
  bar.className = "banner asset-bar";
  bar.style.cssText = "margin:12px 28px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap";
  bar.innerHTML = `<span style="flex:1;min-width:200px">${assetLoginErr ? "沒辦法自動登入設備資產：" + esc(assetLoginErr) : "不用收登入信：按右邊按鈕，用平台的 Google 帳號直接登入設備資產。"}</span><button class="btn primary small" data-assetg>用 Google 帳號登入</button>`;
  $("#main").insertBefore(bar, f);
  f.classList.add("with-sub");
  bar.querySelector("[data-assetg]").onclick = async () => {
    bar.querySelector("span").innerHTML = '<span class="spin"></span> 登入中…';
    const ok = await assetSignIn(true);
    if (ok) { bar.remove(); f.classList.remove("with-sub"); f.src = src; toast("已登入設備資產"); }
    else bar.querySelector("span").textContent = "登入失敗" + (assetLoginErr ? "：" + assetLoginErr : "，請再試一次");
  };
}
window.__pfSb = () => sbSession();   // 讓工作台（郵件收發）同步員工名單時借用設備資產的登入
async function sbSession() {
  try { const sb = await sbClient(); if (!sb) return null; const {data: {session}} = await sb.auth.getSession(); return session ? sb : null; } catch (e) { return null; }
}
const ROLE2V = {admin: "管理", viewer: "檢視"}, V2ROLE = {"管理": "admin", "檢視": "viewer"};
/** 讀設備資產系統裡的管理員／唯讀名單 */
async function assetRoles() {
  const sb = await sbSession();
  if (!sb) return {nosession: true};
  const {data, error} = await sb.from("roles").select("email,role");
  if (error) return {error: error.message};
  return {rows: data || []};
}
/** 平台權限 → 設備資產系統：管理＝admin、檢視＝viewer、—＝移除（只動平台名單上的人） */
const assetCleared = new Set();   // 這次在設定頁手動改成「—」的人：只有這些人會從設備資產系統移除
async function syncAssetRoles(rows) {
  const cur = await assetRoles();
  if (cur.nosession) return "設備資產權限還沒同步：請先打開一次「設備資產」分頁登入，再回來按儲存。";
  if (cur.error) return "設備資產權限同步失敗：" + cur.error;
  const have = {}; cur.rows.forEach(r => have[r.email.toLowerCase()] = r.role);
  const ups = [], dels = [];
  rows.forEach(r => {
    const e = r.email.trim().toLowerCase(), want = V2ROLE[r.assets] || "";
    if (want && have[e] !== want) ups.push({email: e, role: want});
    if (!want && have[e] && assetCleared.has(e)) dels.push(e);
  });
  if (!ups.length && !dels.length) return "";
  const sb = await sbClient();
  if (ups.length) { const {error} = await sb.from("roles").upsert(ups, {onConflict: "email"}); if (error) return "設備資產權限同步失敗：" + error.message; }
  if (dels.length) { const {error} = await sb.from("roles").delete().in("email", dels); if (error) return "設備資產權限部分未同步（" + error.message + "）"; }
  assetCleared.clear();
  return "ok:設備資產權限已同步（" + (ups.length + dels.length) + " 人）";
}

    <datalist id="deptList">${deptList}</datalist>
    <div id="assetSync"></div>
    <div class="tablewrap"><table class="perm" style="min-width:1220px"><thead><tr><th>人員</th><th>平台管理</th><th>工作台</th><th>合約庫</th><th>部門（合約庫選「部門」時）</th><th>函文</th><th>法務期限</th><th>設備資產</th><th>員工旅程</th><th></th></tr></thead>
    <tbody id="pmRows"></tbody></table></div>
    <div class="note" style="margin-top:10px">系統擁有者（${esc(ST.owner)}）永遠有全部權限。函文：管理 = 可以登記、修改、刪除；檢視 = 只能看，但被指定為承辦人的那幾筆可以改狀態、加處理紀錄和附件。工作台：正職可管理全部，PT 只看排班、每日檢核和自己的工作。合約庫：管理 = 可改分類規則；編輯 = 可匯入、修改、上傳；檢視 = 只能看全部合約。員工旅程：管理 = 可以新增員工、勾選所有項目、改清單範本；檢視 = 只能看（被指派到的項目還是可以勾、上傳附件）。</div>`;
  const rowHtml = (r, i) => `<tr data-i="${i}">
    <td><input data-k="name" value="${esc(r.name)}" placeholder="姓名" style="font-weight:600;margin-bottom:3px"><input data-k="email" value="${esc(r.email)}" placeholder="name@swag.live" ${r.email === ST.owner ? "disabled" : ""}></td>
    <td><select data-k="admin" class="v-${esc(r.admin)}">${OPT(["", "是"], r.admin)}</select></td>
    <td><select data-k="work" class="v-${esc(r.work)}">${OPT(V.work, r.work)}</select></td>
    <td><select data-k="contracts" class="v-${esc(r.contracts)}">${OPT(V.contracts, r.contracts)}</select></td>
    <td><input data-k="dept" value="${esc(r.dept)}" list="deptList" placeholder="${r.contracts === "部門" ? "必填，例如 Marketing" : ""}" ${r.contracts === "部門" ? "" : "disabled"} style="${r.contracts === "部門" && !r.dept ? "border-color:var(--danger)" : ""}"></td>
    <td><select data-k="docs" class="v-${esc(r.docs || "—")}">${OPT(V.docs, r.docs || "—")}</select></td>
    <td><select data-k="legal" class="v-${esc(r.legal)}">${OPT(V.legal, r.legal)}</select></td>
    <td><select data-k="assets" class="v-${esc(r.assets)}">${OPT(V.assets, r.assets)}</select></td>
    <td><select data-k="journey" class="v-${esc(r.journey || "—")}">${OPT(V.journey || ["管理", "檢視", "—"], r.journey || "—")}</select></td>
    <td>${r.email === ST.owner ? '<span class="note">擁有者</span>' : `<button class="btn small danger" data-rm="${i}">移除</button>`}</td></tr>`;
  const draw = () => {
    const q = ($("#pmQ").value || "").toLowerCase();
    $("#pmRows").innerHTML = ST.rows.map((r, i) => (!q || (r.name + r.email).toLowerCase().includes(q)) ? rowHtml(r, i) : "").join("") || '<tr><td colspan="10" class="empty">沒有資料</td></tr>';
  };
  draw();
  const dirty = () => { permDirty = true; $("#pmSave").disabled = false; };
  $("#pmQ").oninput = draw;
  $("#pmRows").oninput = e => {
    const el = e.target, tr = el.closest("tr[data-i]"); if (!tr || !el.dataset.k) return;
    const r = ST.rows[+tr.dataset.i]; r[el.dataset.k] = el.value; tr.classList.add("dirty"); dirty();
    if (el.dataset.k === "assets") { if (el.value === "—") assetCleared.add(r.email.toLowerCase()); else assetCleared.delete(r.email.toLowerCase()); }
    if (el.tagName === "SELECT") { el.className = "v-" + el.value; if (el.dataset.k === "contracts") { const d = tr.querySelector('[data-k="dept"]'); d.disabled = el.value !== "部門"; d.placeholder = el.value === "部門" ? "必填，例如 Marketing" : ""; if (el.value === "部門" && !d.value) d.focus(); } }
  };
  $("#stBody").onclick = e => {
    const rm = e.target.closest("[data-rm]");
    if (rm) { const gone = ST.rows.splice(+rm.dataset.rm, 1)[0]; if (gone && gone.assets !== "—") assetCleared.add(gone.email.toLowerCase()); draw(); dirty(); return; }
    const am = e.target.closest("[data-addm]");
    if (am) { const m = ST.members.find(x => x.email === am.dataset.addm); ST.rows.push({email: m.email, name: m.name, admin: "", work: m.type === "正職" ? "正職" : "PT", contracts: "—", legal: "—", assets: "—", docs: "—", journey: "—", dept: ""}); am.remove(); draw(); dirty(); return; }
  };
  if (C.SUPABASE_URL) assetRoles().then(cur => {
    const box = $("#assetSync"); if (!box) return;
    if (cur.nosession) { box.innerHTML = '<div class="banner warn">設備資產的權限會同步到設備資產系統。請先打開一次「設備資產」分頁登入，這裡才能讀寫它的管理員名單。</div>'; return; }
    if (cur.error) { box.innerHTML = `<div class="banner err">讀不到設備資產系統的權限：${esc(cur.error)}（只有設備資產的「管理」才能讀）</div>`; return; }
    const diff = cur.rows.filter(x => { const r = ST.rows.find(y => y.email === x.email.toLowerCase()); return !r || r.assets !== ROLE2V[x.role]; });
    const extra = ST.rows.filter(r => r.assets !== "—" && !cur.rows.some(x => x.email.toLowerCase() === r.email));
    if (!diff.length && !extra.length) { box.innerHTML = '<div class="note" style="margin:-6px 0 10px">✓ 設備資產權限和設備資產系統一致</div>'; return; }
    diff.forEach(x => { const e = x.email.toLowerCase(); let r = ST.rows.find(y => y.email === e); if (!r) { r = {email: e, name: "", admin: "", work: "—", contracts: "—", legal: "—", assets: "—", docs: "—", journey: "—", dept: ""}; ST.rows.push(r); } r.assets = ROLE2V[x.role]; });
    if (diff.length) { draw(); dirty(); }
    else if (extra.length) $("#pmSave").disabled = false;
    box.innerHTML = `<div class="banner warn">${diff.length ? `已依設備資產系統帶入 ${diff.length} 人的設備資產權限：${diff.map(x => esc(x.email.split("@")[0]) + "（" + ROLE2V[x.role] + "）").join("、")}。` : ""}${extra.length ? `有 ${extra.length} 人還沒同步到設備資產系統。` : ""}確認後按「儲存變更」，兩邊就會一致。</div>`;
  });
  $("#pmAdd").onclick = () => { ST.rows.unshift({email: "", name: "", admin: "", work: "—", contracts: "—", legal: "—", assets: "—", docs: "—", journey: "—", dept: ""}); $("#pmQ").value = ""; draw(); dirty(); const f = $('#pmRows tr input[data-k="name"]'); if (f) f.focus(); };
  $("#pmSave").onclick = async () => {
    const b = $("#pmSave");
    const rows = ST.rows.filter(r => r.email.trim());
    const bad = rows.filter(r => !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(r.email.trim()));
    if (bad.length) return toast("Email 格式不對：" + bad.map(r => r.email).join("、"));
    b.disabled = true; b.innerHTML = '<span class="spin"></span> 儲存中';
    try {
      const r = await PF.call("pf_apiSavePerms", [rows]); Object.assign(ST, r); permDirty = false;
      const m = C.SUPABASE_URL ? await syncAssetRoles(ST.rows) : "";
      toast(m.startsWith("ok:") ? "權限已更新，" + m.slice(3) : m ? "權限已更新。" + m : "權限已更新");
      permTab();
    }
    catch (err) { toast(err.message); b.disabled = false; b.textContent = "儲存變更"; }
  };
}
function headsTab() {
  const heads = ST.rows.filter(r => r.contracts === "部門");
  const covered = new Set();
  heads.forEach(h => String(h.dept).split(/\s*,\s*/).filter(Boolean).forEach(d => covered.add(d.toLowerCase())));
  const missing = ST.depts.filter(d => !covered.has(d.name.toLowerCase()));
  const cnt = d => (ST.depts.find(x => x.name.toLowerCase() === d.toLowerCase()) || {count: 0}).count;
  const days = (ST.settings.ctDays || "30,14,7,3,1,0").split(",").map(x => x === "0" ? "當天" : x + " 天").join("、");
  $("#stBody").innerHTML = `
    <div class="banner">部門主管每天 09:00 檢查一次：自己部門的合約剛好剩 <b>${esc(days)}</b> 時，寄一封彙整 Email；已到期未處理的每週一再提醒。部門主管登入後只看得到自己部門的合約。</div>
    <div class="toolbar"><h2 style="font-size:16px">部門主管（${heads.length}）</h2><span class="sp"></span><button class="btn" data-st="perm" onclick="">到「權限」新增或修改</button></div>
    <div class="tablewrap"><table style="min-width:720px"><thead><tr><th>主管</th><th>負責部門</th><th>合約數</th><th></th></tr></thead><tbody>
    ${heads.length ? heads.map(h => `<tr><td><b>${esc(h.name || h.email)}</b><div class="note">${esc(h.email)}</div></td>
      <td>${String(h.dept || "").split(/\s*,\s*/).filter(Boolean).map(d => `<span class="chip amber">${esc(d)}</span>`).join(" ") || '<span class="chip red">未填部門</span>'}</td>
      <td>${String(h.dept || "").split(/\s*,\s*/).filter(Boolean).reduce((a, d) => a + cnt(d), 0)}</td>
      <td style="text-align:right;white-space:nowrap"><button class="btn small" data-prev="${esc(h.email)}">預覽通知信</button> <button class="btn small" data-test="${esc(h.email)}">寄測試信給我</button></td></tr>`).join("")
    : '<tr><td colspan="4" class="empty">還沒有設定部門主管。到「權限」把主管的合約庫設成「部門」並填入部門。</td></tr>'}
    </tbody></table></div>
    ${missing.length ? `<div class="toolbar" style="margin-top:22px"><h2 style="font-size:16px">還沒有主管的部門（${missing.length}）</h2></div>
      <div class="card" style="--mc:var(--warn)">${missing.map(d => `<span class="chip" style="margin:3px">${esc(d.name)}・${d.count}</span>`).join("")}
      <div class="note" style="margin-top:8px">這些部門的合約到期只會出現在行政的合約庫提醒，不會寄給部門。</div></div>` : ""}`;
  $("#stBody").onclick = async e => {
    const st = e.target.closest("[data-st]"); if (st) { stTab = st.dataset.st; if (stTab === "perm") return go("settings"); return stRender(); }
    const p = e.target.closest("[data-prev]"), t = e.target.closest("[data-test]");
    if (p) {
      p.disabled = true;
      try {
        const r = await PF.call("pf_apiDigestPreview", [p.dataset.prev]);
        const d = document.createElement("div"); d.className = "drawer";
        d.innerHTML = `<div class="panel wide"><div class="hdr"><h2>通知信預覽</h2><button class="btn small" data-x>關閉</button></div>
          <dl class="dl"><dt>收件人</dt><dd>${esc(p.dataset.prev)}</dd><dt>主旨</dt><dd><b>${esc(r ? r.subject : "")}</b></dd></dl>
          <iframe class="mailprev" sandbox></iframe><div class="note">實際只會在有合約剛好到提醒天數（或週一有已到期合約）時寄出。</div></div>`;
        document.body.appendChild(d);
        d.querySelector("iframe").srcdoc = r ? r.html : "<p>沒有資料</p>";
        d.onclick = ev => { if (ev.target === d || ev.target.closest("[data-x]")) d.remove(); };
      } catch (err) { toast(err.message); }
      p.disabled = false;
    }
    if (t) { t.disabled = true; try { toast(await PF.call("pf_apiDigestTest", [t.dataset.test])); } catch (err) { toast(err.message); } t.disabled = false; }
  };
}
function notifyTab() {
  const s = ST.settings;
  $("#stBody").innerHTML = `<div class="card" style="max-width:720px;display:flex;flex-direction:column;gap:14px">
    <label class="fld">平台網址（Email 裡的按鈕會連到這裡）<input id="n_site" value="${esc(s.siteUrl)}"></label>
    <div class="row2">
      <label class="fld">法務期限：預設到期前幾天提醒<input id="n_legal" value="${esc(s.legalDays)}"></label>
      <label class="fld">合約到期：部門主管在剩幾天時收到通知<input id="n_ct" value="${esc(s.ctDays)}"></label>
    </div>
    <label class="fld">函文：回覆期限前幾天提醒承辦人<input id="n_doc" value="${esc(s.docDays || "7,3,1,0")}"></label>
    <label class="fld">逾期時一併通知（行政主管）<input id="n_esc" value="${esc(s.escalate)}" placeholder="lynn@swag.live"></label>
    <label class="fld">法務期限提醒副本（選填，多位用逗號）<input id="n_cc" value="${esc(s.ccLegal)}"></label>
    <div class="note">提醒由 Apps Script 每天 09:00 自動寄出（寄件人是系統擁有者的 Gmail，顯示名稱「SWAG 行政平台」）。</div>
    <div><button class="btn primary" id="n_save">儲存</button></div></div>`;
  $("#n_save").onclick = async () => {
    const b = $("#n_save"); b.disabled = true;
    try {
      ST.settings = ME.settings = await PF.call("pf_apiSaveSettings", [{siteUrl: $("#n_site").value, legalDays: $("#n_legal").value, ctDays: $("#n_ct").value, docDays: $("#n_doc").value, escalate: $("#n_esc").value, ccLegal: $("#n_cc").value}]);
      toast("已儲存"); notifyTab();
    } catch (err) { toast(err.message); b.disabled = false; }
  };
}
window.addEventListener("beforeunload", e => { if (permDirty && view === "settings") { e.preventDefault(); e.returnValue = ""; } });

boot();
})();
</script>
</body>
</html>
